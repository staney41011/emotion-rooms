<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>講師控制台｜情緒包廂</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <main class="shell">
    <div class="topbar"><a class="back-link" href="index.html">← 回首頁</a><div class="brand">🎛️ 講師控制台</div></div>
    <section class="panel">
      <div style="display:flex;align-items:flex-start;justify-content:space-between;gap:20px;flex-wrap:wrap">
        <div><div class="eyebrow">CLASS DASHBOARD</div><h1 style="font-size:clamp(2rem,5vw,3.2rem);margin-bottom:8px">情緒包廂即時狀態</h1><p class="small-note">目前使用 Demo localStorage。Firebase 接上後，這裡的功能會直接沿用。</p></div>
        <div class="btn-row"><button class="btn soft" id="lockBtn">暫停投稿</button><button class="btn danger" id="clearAllBtn">清空全部</button></div>
      </div>
      <div class="stat-grid" id="statGrid" style="margin-top:22px"></div>
    </section>
    <div class="admin-grid">
      <section class="panel"><div style="display:flex;align-items:center;justify-content:space-between;gap:10px"><h2>最新投稿</h2><select class="input" id="roomFilter" style="width:auto"></select></div><div class="submission-list" id="submissionList" style="margin-top:16px"></div></section>
      <section class="panel"><h2>包廂操作</h2><p class="small-note">切換包廂後可載入示範資料或清空該包廂。</p><select class="input" id="actionRoom" style="margin-top:14px"></select><div class="btn-row"><button class="btn primary" id="seedRoomBtn">載入示範資料</button><button class="btn danger" id="clearRoomBtn">清空本包廂</button></div><hr style="border:0;border-top:1px solid var(--line);margin:24px 0"><a class="btn soft" href="display.html" target="_blank">開啟投影畫面 ↗</a></section>
    </div>
  </main>
  <script type="module" src="js/admin.js"></script>
</body>
</html>
