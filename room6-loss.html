<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate, max-age=0">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>第6間體驗</title>
<style>
html,body{margin:0;width:100%;height:100%;background:#050607;color:#e8edf2;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans TC",sans-serif}body{display:grid;place-items:center}.loading{text-align:center;color:#8f99a5}.loading b{display:block;color:#eef2f6;font-size:1.25rem;margin-bottom:8px}.retry{margin-top:18px;border:1px solid #343a40;background:#11161b;color:#eef2f6;border-radius:12px;padding:10px 16px;cursor:pointer}
</style>
</head>
<body>
<div class="loading" id="loading"><b>第6間體驗</b>正在讀取…</div>
<script>
(async()=>{
  const fresh=Date.now();
  const base=new URL('.',location.href);
  const fetchText=async(path)=>{
    const url=new URL(path,base);
    url.searchParams.set('v',fresh);
    const res=await fetch(url,{cache:'no-store'});
    if(!res.ok) throw new Error(`${path}: ${res.status}`);
    return res.text();
  };
  const cleanB64=(text)=>text.replace(/\s+/g,'');
  const dataAvif=async(paths)=>'data:image/avif;base64,'+(await Promise.all(paths.map(fetchText))).map(cleanB64).join('');
  const dataJpeg=async(paths)=>'data:image/jpeg;base64,'+(await Promise.all(paths.map(fetchText))).map(cleanB64).join('');
  const assetUrl=(path)=>{const u=new URL(path,base);u.searchParams.set('v',fresh);return u.href};
  try{
    const [htmlSource,helperCss,helperJs,performance,focus,hotpot,walkChat,walkPack,walkBacks,walkNotice]=await Promise.all([
      fetchText('experience-room6-content.html'),
      fetchText('room6-characters.css'),
      fetchText('room6-characters.js'),
      dataAvif(['assets/room6/hq4/dual-performance.avif.part01.b64','assets/room6/hq4/dual-performance.avif.part02.b64']),
      dataAvif(['assets/room6/hq4/post-show-focus.avif.part01.b64','assets/room6/hq4/post-show-focus.avif.part02.b64']),
      dataJpeg([
        'assets/room6/hq6/vegetarian-hotpot.part01.b64',
        'assets/room6/hq6/vegetarian-hotpot.part02.b64',
        'assets/room6/hq6/vegetarian-hotpot.part03.b64',
        'assets/room6/hq6/vegetarian-hotpot.part04.b64'
      ]),
      Promise.resolve(assetUrl('assets/room6/hq5/walk-chat-classroom.avif')),
      dataAvif(['assets/room6/hq5/walk-pack-bag.b64']),
      dataAvif(['assets/room6/hq5/walk-group-backs.b64']),
      dataAvif(['assets/room6/hq4/walk-final-notice.avif.b64'])
    ]);
    let html=htmlSource
      .replace('星期日 · 8月30日','星期五 · 9月4日')
      .replace('星期一 · 8月31日','星期六 · 9月5日')
      .replace(
        "function scene3(){show(privateShell());addMsg('佳怡','明天一起吃飯嗎？',500,false,'#b66d8b');",
        "function scene3(){show(privateShell());later(()=>{const c=document.querySelector('#chat');if(c){const x=document.createElement('div');x.className='day-divider';x.textContent='昨天';c.appendChild(x)}},120);addMsg('佳怡','明天一起吃飯嗎？',500,false,'#b66d8b');"
      )
      .replace(
        "later(()=>document.querySelector('#typing')?.remove(),10600);addMsg('佳怡','抱歉，我今天臨時有事',10800,false,'#b66d8b');",
        "later(()=>{const c=document.querySelector('#chat');if(c){const x=document.createElement('div');x.className='day-divider';x.textContent='今天';c.appendChild(x)}},7000);later(()=>document.querySelector('#typing')?.remove(),10600);addMsg('佳怡','抱歉，我今天臨時有事',10800,false,'#b66d8b');"
      )
      .replace('<div class="walk-card-overlay">18:12　教室門口</div>','<div class="walk-card-overlay">教室門口</div>')
      .replace(
        "addNotice('系','系統','電量剩餘 31%',15700);",
        "addNotice('系','系統','電量剩餘 31%',15700);addNotice('群','朋友們','@你　剩你還沒交報告，大家都在等你了',18400);"
      );
    const photo=(src,cls='room6-native-img')=>`<img class="${cls}" src="${src}" alt="" loading="eager" decoding="async">`;
    const hotpotFallback=assetUrl('assets/room6/vegetarian-hotpot.jpg');
    const hotpotPhoto=`<img class="room6-native-img" src="${hotpot}" alt="" loading="eager" decoding="async" onerror="this.onerror=null;this.src='${hotpotFallback}'">`;
    html=html.replace('<div class="party-table"></div>',`<div class="party-table room6-native-photo">${hotpotPhoto}</div>`);
    html=html.replace('<div class="perform-stage">',`<div class="perform-stage room6-native-photo">${photo(performance)}`);
    html=html.replace('<div class="stage-mini"></div>',`<div class="stage-mini room6-native-photo">${photo(focus)}</div>`);
    const walkSources={'walk-chat-classroom':walkChat,'walk-pack-bag':walkPack,'walk-group-backs':walkBacks,'walk-final-notice':walkNotice};
    for(const [name,src] of Object.entries(walkSources)){
      const re=new RegExp(`<img[^>]*src=["'][^"']*${name}\\.(?:jpg|jpeg|png|avif)[^"']*["'][^>]*>`,'gi');
      html=html.replace(re,photo(src,'room6-walk-img'));
    }
    const directCss=`
      .room6-native-photo{position:relative!important;overflow:hidden!important;background:#090b0e!important}
      .room6-native-img,.room6-walk-img{position:absolute!important;inset:0!important;width:100%!important;height:100%!important;display:block!important;z-index:2!important;image-rendering:auto!important}
      .story-screen .party-table.room6-native-photo{position:absolute!important;inset:0!important;width:100%!important;height:100%!important;border-radius:0!important;box-shadow:none!important;background:#090b0e!important}
      .story-screen .party-table.room6-native-photo:before{display:none!important}
      .story-screen .party-table.room6-native-photo .room6-native-img{object-fit:contain!important;object-position:center!important}
      .story-screen .story-head,.story-screen .story-progress,.story-screen .story-text,.story-screen .story-nav{z-index:8!important}
      .day-divider{display:flex!important;align-items:center!important;gap:10px!important;color:#8b9299!important;font-size:.74rem!important;font-weight:850!important;letter-spacing:.08em!important;margin:8px 4px 6px!important;opacity:1!important;transform:none!important;animation:none!important}
      .day-divider:before,.day-divider:after{content:'';height:1px;flex:1;background:#d5d9df}
      .perform-stage.room6-native-photo{width:min(430px,88vw)!important;height:min(764px,82vh)!important;aspect-ratio:800/1421!important;border-radius:26px!important;background:#090b0e!important;box-shadow:0 28px 80px rgba(0,0,0,.55)!important}
      .perform-stage.room6-native-photo .room6-native-img{object-fit:contain!important;object-position:center!important}
      .perform-stage.room6-native-photo .spot,.perform-stage.room6-native-photo .performers{display:none!important}
      .perform-stage.room6-native-photo:before{content:'阿哲';left:18%;position:absolute;bottom:18px;z-index:8;padding:7px 14px;border-radius:999px;background:rgba(8,10,14,.72);color:#fff;font-weight:900}
      .perform-stage.room6-native-photo:after{content:'你';right:18%;position:absolute;bottom:18px;z-index:8;padding:7px 14px;border-radius:999px;background:rgba(8,10,14,.72);color:#fff;font-weight:900}
      .stage-mini.room6-native-photo{height:66%!important;width:auto!important;aspect-ratio:800/1421!important;background:#090b0e!important;border-radius:18px!important}
      .stage-mini.room6-native-photo .room6-native-img{object-fit:contain!important;object-position:center!important}
      .stage-mini.room6-native-photo:before,.stage-mini.room6-native-photo .mini-performer{display:none!important}
      .story-card .story-head,.story-card .story-comment,.story-card .story-nav,.story-card .tag-focus,.story-card .story-progress{z-index:8!important}
      .walk-wrap{width:min(720px,94vw)!important;height:auto!important;aspect-ratio:16/9!important;max-height:72vh!important}
      .walk-scene{border-radius:24px!important}
      .walk-photo,.walk-photo.show{transform:none!important;background:#090b0e!important}
      .walk-photo .room6-walk-img{object-fit:cover!important;object-position:center!important;transform:none!important}
      .walk-photo.show .room6-walk-img{transform:none!important}
      .walk-card-overlay{font-size:1rem!important;font-weight:950!important;padding:10px 14px!important;background:rgba(9,13,18,.82)!important;color:#fff!important;border:1px solid rgba(255,255,255,.18)!important;box-shadow:0 8px 28px rgba(0,0,0,.35)!important;text-shadow:0 1px 4px rgba(0,0,0,.7)!important;backdrop-filter:blur(8px)!important}
      @media(max-width:600px){.perform-stage.room6-native-photo{width:min(400px,91vw)!important;height:min(710px,78vh)!important}.walk-wrap{width:min(640px,94vw)!important}.walk-card-overlay{font-size:.92rem!important;left:14px!important;top:14px!important}}
    `;
    html=html.replace('</head>',`<style id="room6-local-css">${helperCss}\n${directCss}</style></head>`);
    const safeHelperJs=helperJs.replace(/<\/script/gi,'<\\/script');
    html=html.replace('</body>',`<script id="room6-local-js">${safeHelperJs}<\/script></body>`);
    document.open();document.write(html);document.close();
  }catch(error){
    console.error(error);
    document.querySelector('#loading').innerHTML='<b>讀取失敗</b>請重新整理後再試一次。<br><button class="retry" onclick="location.reload()">重新讀取</button>';
  }
})();
window.addEventListener('pageshow',(event)=>{if(event.persisted)location.reload()});
</script>
</body>
</html>
