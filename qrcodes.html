<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate, max-age=0">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <title>包廂 QR Code｜講師用</title>
  <link rel="stylesheet" href="css/style.css?v=20260903-1">
  <style>
    .qr-toolbar{display:flex;justify-content:space-between;gap:16px;align-items:center;margin-bottom:24px;flex-wrap:wrap}
    .qr-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:22px}
    .qr-card{background:#fff;border:1px solid rgba(20,28,48,.12);border-radius:24px;padding:26px;text-align:center;break-inside:avoid}
    .qr-card h2{font-size:2rem;margin:0 0 6px}.qr-order{color:#8a91a2;font-size:.85rem;font-weight:800}.qr-box{display:flex;justify-content:center;margin:14px auto 18px}.qr-url{font-size:.78rem;word-break:break-all;color:#6b7280}.teacher-only{margin-top:12px;font-size:.9rem;color:#6b7280}
    @media(max-width:720px){.qr-grid{grid-template-columns:1fr}}
    @media print{body{background:#fff}.topbar,.qr-toolbar,.teacher-only{display:none!important}.shell{max-width:none;padding:0}.qr-grid{grid-template-columns:repeat(2,1fr);gap:10mm}.qr-card{border:1px solid #bbb;border-radius:12px;padding:10mm;min-height:120mm;display:flex;flex-direction:column;justify-content:center}.qr-url{font-size:9pt}.qr-card h2{font-size:24pt}}
  </style>
</head>
<body>
  <main class="shell">
    <div class="topbar"><div class="brand"><span class="brand-mark">QR</span> 包廂 QR Code</div><span class="small-note">講師用</span></div>
    <div class="qr-toolbar">
      <div><h1 style="margin:0 0 8px">6 間包廂 QR Code</h1><div class="small-note">會使用你在講師控制台輸入的包廂名稱。</div></div>
      <button class="btn primary" type="button" onclick="window.print()">列印 QR Code</button>
    </div>
    <section class="qr-grid" id="qrGrid"></section>
  </main>
  <script>window.addEventListener('pageshow',(event)=>{if(event.persisted)window.location.reload();});</script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <script type="module">
    import { ROOMS } from './js/rooms.js?v=20260903-1';
    import { getRoomLabels } from './js/room-labels.js?v=20260903-1';

    const grid = document.querySelector('#qrGrid');
    const labels = getRoomLabels(location.search);
    const STUDENT_URL = 'https://staney41011.github.io/emotion-rooms/student.html';
    const SITE_VERSION = '20260903-1';

    ROOMS.forEach((room) => {
      const label = labels[room.id] || `第 ${room.number} 間包廂`;
      const url = new URL(STUDENT_URL);
      url.searchParams.set('room', room.id);
      url.searchParams.set('label', label);
      url.searchParams.set('v', SITE_VERSION);

      const card = document.createElement('article');
      card.className = 'qr-card';
      card.innerHTML = `
        <div class="qr-order">第 ${room.number} 間</div>
        <h2>${label}</h2>
        <div class="qr-box" id="qr-${room.id}"></div>
        <div class="qr-url">${url.href}</div>
        <div class="teacher-only">講師內部對照：${room.name}｜${room.subtitle}</div>
      `;
      grid.appendChild(card);

      new QRCode(document.querySelector(`#qr-${room.id}`), {
        text: url.href,
        width: 210,
        height: 210,
        correctLevel: QRCode.CorrectLevel.M
      });
    });
  </script>
</body>
</html>
