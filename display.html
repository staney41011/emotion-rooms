<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate, max-age=0">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <title>感受文字雲｜投影畫面</title>
  <link rel="stylesheet" href="css/style.css?v=20260829-2">
</head>
<body class="display-page">
  <main class="display-shell">
    <div class="display-ambient" aria-hidden="true">
      <div class="ambient-orb ambient-orb-1"></div>
      <div class="ambient-orb ambient-orb-2"></div>
      <div class="ambient-orb ambient-orb-3"></div>
      <div class="ambient-ribbon ambient-ribbon-1"></div>
      <div class="ambient-ribbon ambient-ribbon-2"></div>
      <div class="ambient-particles"></div>
      <div class="ambient-vignette"></div>
    </div>

    <div class="display-toolbar">
      <div class="display-brand"><span class="live-dot"></span>感受文字雲 · LIVE</div>
      <div class="btn-row" style="margin:0"><button class="btn soft display-fullscreen" id="fullscreenBtn">全螢幕</button></div>
    </div>

    <section class="cloud-stage">
      <div class="cloud-title" id="cloudTitle"></div>
      <div class="word-cloud" id="wordCloud"></div>
    </section>

    <footer class="display-footer"><span id="submissionCount">待機中</span></footer>
  </main>
  <script>
    window.addEventListener('pageshow', (event) => {
      if (event.persisted) window.location.reload();
    });
  </script>
  <script type="module" src="js/display.js?v=20260829-2"></script>
</body>
</html>
