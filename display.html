<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>感受文字雲｜講師投影</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body style="background:#0d1020">
  <main class="display-shell">
    <div class="display-toolbar">
      <div class="display-brand">感受文字雲 · LIVE</div>
      <div class="room-tabs" id="roomTabs"></div>
      <div class="btn-row" style="margin:0"><button class="btn soft" id="seedBtn">示範資料</button><button class="btn soft" id="fullscreenBtn">全螢幕</button></div>
    </div>
    <section class="cloud-stage">
      <div class="cloud-title" id="cloudTitle"></div>
      <div class="word-cloud" id="wordCloud"></div>
    </section>
    <footer class="display-footer"><span id="submissionCount">0 份投稿</span><span>Firebase 即時同步</span></footer>
  </main>
  <script type="module" src="js/display.js"></script>
</body>
</html>
