<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate, max-age=0">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>第4間體驗</title>
<style>
html,body{margin:0;width:100%;height:100%;background:#050607;color:#e8edf2;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans TC",sans-serif}body{display:grid;place-items:center}.loading{text-align:center;color:#8f99a5}.loading b{display:block;color:#eef2f6;font-size:1.25rem;margin-bottom:8px}.retry{margin-top:18px;border:1px solid #343a40;background:#11161b;color:#eef2f6;border-radius:12px;padding:10px 16px;cursor:pointer}
</style>
</head>
<body>
<div class="loading" id="loading"><b>第4間體驗</b>正在讀取最新版本…</div>
<script>
(async()=>{
  const source='https://raw.githubusercontent.com/staney41011/emotion-rooms/main/experience-room4-content.html';
  try{
    const response=await fetch(`${source}?_fresh=${Date.now()}`,{cache:'no-store'});
    if(!response.ok) throw new Error(`HTTP ${response.status}`);
    const html=await response.text();
    document.open();
    document.write(html);
    document.close();
  }catch(error){
    document.querySelector('#loading').innerHTML='<b>讀取失敗</b>請確認網路後再試一次。<br><button class="retry" onclick="location.reload()">重新讀取</button>';
  }
})();
window.addEventListener('pageshow',(event)=>{if(event.persisted)location.reload()});
</script>
</body>
</html>
