<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate, max-age=0">
<meta http-equiv="Pragma" content="no-cache"><meta http-equiv="Expires" content="0">
<title>第4間體驗</title>
<style>
:root{color-scheme:dark;--bg:#050708;--ink:#f5f6f7;--muted:#92999f;--line:rgba(255,255,255,.12);--green:#7bf0b6;--red:#ff7d78}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#050708;color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans TC",sans-serif}
button{font:inherit}.app{position:relative;width:100%;height:100%;display:grid;place-items:center;background:radial-gradient(circle at 50% 30%,#172029 0,#080b0e 45%,#030405 100%)}
.app::before{content:"";position:absolute;inset:0;background:linear-gradient(110deg,transparent 0 45%,rgba(255,255,255,.025) 50%,transparent 55%);pointer-events:none}
.phone{position:relative;width:min(430px,92vw);height:min(850px,92vh);border-radius:48px;background:#11161b;border:1px solid rgba(255,255,255,.15);box-shadow:0 35px 110px rgba(0,0,0,.68),inset 0 0 0 7px #080a0d;overflow:hidden;opacity:0;transform:translateY(10px) scale(.985);transition:opacity .8s,transform .8s}
.phone.show{opacity:1;transform:none}.notch{position:absolute;z-index:10;top:11px;left:50%;transform:translateX(-50%);width:126px;height:30px;border-radius:18px;background:#030405}
.status{height:54px;padding:15px 23px 0;display:flex;align-items:center;justify-content:space-between;font-size:.81rem;font-weight:800;color:#eef1f4;position:relative;z-index:2}.battery{display:flex;gap:7px;align-items:center}.battery i{display:block;width:22px;height:10px;border:1px solid #dce1e5;border-radius:3px;position:relative}.battery i::after{content:"";position:absolute;left:2px;top:2px;bottom:2px;width:var(--battery,70%);background:currentColor;border-radius:1px}.screen{position:absolute;inset:54px 0 0;background:#eef1f3;color:#111923;transition:background .5s,color .5s;overflow:hidden}.screen.dark{background:#0b0e12;color:#f2f4f6}
.scene{position:absolute;inset:0;padding:28px 22px 26px;opacity:0;transform:translateY(7px);transition:opacity .85s,transform .85s}.scene.on{opacity:1;transform:none}.scene h2{font-size:1rem;margin:0 0 7px;color:#75808a;letter-spacing:.04em}.scene .big{font-size:2.25rem;font-weight:950;letter-spacing:-.05em;line-height:1.05}.scene .sub{margin-top:9px;color:#66717b;line-height:1.55;font-size:.96rem}.dark .scene h2,.dark .scene .sub{color:#89929b}
.map{height:355px;margin-top:24px;border-radius:28px;background:linear-gradient(145deg,#dde6df,#cfd8d1);position:relative;overflow:hidden;border:1px solid rgba(0,0,0,.06)}.road{position:absolute;height:14px;background:#f7f8f7;border:1px solid #c0c9c2;border-radius:99px;transform-origin:left center}.r1{width:340px;left:26px;top:75px;transform:rotate(28deg)}.r2{width:290px;left:62px;top:210px;transform:rotate(-14deg)}.route{position:absolute;left:65px;top:52px;width:270px;height:210px;border:7px solid transparent;border-left-color:#2878ff;border-bottom-color:#2878ff;border-radius:0 0 0 70px;transform:rotate(-8deg)}.dot{position:absolute;width:17px;height:17px;border-radius:50%;background:#2878ff;border:4px solid #fff;box-shadow:0 2px 12px rgba(0,0,0,.25)}.dot.start{left:82px;top:74px}.dot.end{right:48px;bottom:56px;background:#e94747}.eta{margin-top:18px;background:#fff;border-radius:22px;padding:18px;display:flex;justify-content:space-between;align-items:end;box-shadow:0 8px 30px rgba(0,0,0,.08)}.eta strong{font-size:2.05rem;letter-spacing:-.04em}.eta small{display:block;color:#7b858e;margin-top:4px}.delay{color:#d64545;font-weight:900}
.notice-stack{display:flex;flex-direction:column;gap:11px;margin-top:26px}.notice{background:#fff;border-radius:22px;padding:15px 16px;box-shadow:0 8px 28px rgba(0,0,0,.08);display:flex;gap:12px;align-items:flex-start}.avatar{width:41px;height:41px;border-radius:13px;background:#d7e5ff;display:grid;place-items:center;font-weight:950;color:#3562aa;flex:0 0 auto}.notice .n-title{font-weight:900}.notice .n-text{font-size:.9rem;color:#69747e;margin-top:3px;line-height:1.45}.urgent{border:1px solid rgba(214,69,69,.22);box-shadow:0 9px 30px rgba(198,52,52,.12)}
.call{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;background:linear-gradient(#17222b,#0a0e12);color:#fff;margin:-28px -22px -26px;padding:25px}.call .avatar{width:104px;height:104px;border-radius:50%;font-size:2rem;margin-bottom:22px}.call .who{font-size:2rem;font-weight:900}.call .label{color:#9ca6ae;margin-top:5px}.call-actions{display:flex;gap:74px;margin-top:86px}.circle{width:69px;height:69px;border-radius:50%;display:grid;place-items:center;font-size:1.6rem;background:#38c273}.circle.reject{background:#ef5350}
.chat{height:100%;display:flex;flex-direction:column}.chat-head{margin:-28px -22px 0;padding:17px 18px 15px;background:#f7f8f9;border-bottom:1px solid #dfe4e8;display:flex;align-items:center;gap:10px}.chat-head .avatar{width:34px;height:34px;border-radius:50%}.chat-name{font-weight:900}.chat-body{flex:1;padding:22px 0;display:flex;flex-direction:column;justify-content:flex-end;gap:10px}.bubble{max-width:82%;padding:11px 14px;border-radius:18px;line-height:1.45;font-size:.98rem}.mine{align-self:flex-end;background:#8ee272;color:#10210f;border-bottom-right-radius:5px}.theirs{align-self:flex-start;background:#fff;border:1px solid #e0e4e7;border-bottom-left-radius:5px}.read{align-self:flex-end;color:#89929b;font-size:.78rem;margin-top:-4px}.compose{background:#fff;border-radius:20px;border:1px solid #dfe4e7;padding:12px 14px;color:#20262c;margin-top:12px}.typing{align-self:flex-start;display:flex;gap:5px;background:#fff;border:1px solid #e0e4e7;border-radius:18px;padding:14px 17px}.typing i{width:7px;height:7px;border-radius:50%;background:#9aa1a8;animation:blink 1.1s infinite}.typing i:nth-child(2){animation-delay:.18s}.typing i:nth-child(3){animation-delay:.36s}@keyframes blink{0%,70%,100%{opacity:.25}35%{opacity:1}}
.black{position:absolute;inset:0;background:#000;display:grid;place-items:center;text-align:center;color:#f4f4f4;padding:30px}.black .line{font-size:clamp(1.5rem,5vw,2.4rem);font-weight:850;line-height:1.5}.black .small{margin-top:14px;color:#707070}
.overlay{position:absolute;z-index:20;inset:0;background:radial-gradient(circle at 50% 34%,#202c35,#090c0f 58%,#030405);display:grid;place-items:center;padding:24px}.intro{text-align:center;width:min(650px,92vw)}.num{width:70px;height:70px;margin:auto;border-radius:23px;background:#edf4f7;color:#10171c;display:grid;place-items:center;font-size:2rem;font-weight:950}.intro h1{font-size:clamp(2.8rem,8vw,5.4rem);margin:24px 0 13px;letter-spacing:-.055em}.intro p{color:#a4adb4;line-height:1.8;font-size:1.05rem}.start{margin-top:30px;border:0;border-radius:17px;background:#f2f6f8;color:#11181d;padding:16px 30px;font-weight:950;font-size:1.08rem;cursor:pointer}.corner{position:absolute;z-index:15;left:18px;top:17px;color:rgba(255,255,255,.48);font-size:.82rem;font-weight:800;letter-spacing:.05em}.restart{position:absolute;z-index:15;right:18px;top:12px;border:1px solid rgba(255,255,255,.1);background:rgba(0,0,0,.22);color:rgba(255,255,255,.55);border-radius:11px;padding:7px 10px;cursor:pointer}.end{display:none;position:absolute;z-index:18;inset:0;background:#000;place-items:center;text-align:center}.end.show{display:grid}.end h2{font-size:clamp(3rem,10vw,7rem);margin:0}.end p{color:#777}.again{margin-top:24px;border:1px solid #333;background:#111;color:#eee;border-radius:14px;padding:12px 18px;cursor:pointer}
@media(max-width:550px){.phone{height:88vh;border-radius:38px}.map{height:300px}.scene{padding:22px 17px}.call{margin:-22px -17px -26px}.chat-head{margin:-22px -17px 0}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<main class="app">
<div class="corner">第4間體驗</div><button class="restart" id="restart" type="button">重來</button>
<div class="phone" id="phone"><div class="notch"></div><div class="status"><span id="clock">08:12</span><span class="battery"><span id="batteryText">72%</span><i id="batteryIcon" style="--battery:72%"></i></span></div><div class="screen" id="screen"><div class="scene" id="scene"></div></div></div>
<div class="end" id="end"><div><h2>完成</h2><p>請依現場指示前往下一步。</p><button class="again" id="again" type="button">再播放一次</button></div></div>
<div class="overlay" id="intro"><div class="intro"><div class="num">4</div><h1>第4間體驗</h1><p>這一段不用回答、也不用操作。<br>請把聲音打開，持續看著畫面，讓情境自己發生。</p><button class="start" id="start" type="button">開始播放</button></div></div>
</main>
<script>
(()=>{
const demo=new URLSearchParams(location.search).get('demo')==='1';
const scale=demo?.075:1;
const phone=document.querySelector('#phone'),screen=document.querySelector('#screen'),scene=document.querySelector('#scene'),clock=document.querySelector('#clock'),batteryText=document.querySelector('#batteryText'),batteryIcon=document.querySelector('#batteryIcon'),intro=document.querySelector('#intro'),end=document.querySelector('#end');
let audio=null,timer=null,index=0,heartbeatTimer=null;
const scenes=[
{d:25,time:'08:12',bat:72,sound:'soft',html:`<h2>導航</h2><div class="big">09:00 前抵達</div><div class="sub">現在出發，時間看起來很充裕。</div><div class="map"><div class="road r1"></div><div class="road r2"></div><div class="route"></div><div class="dot start"></div><div class="dot end"></div></div><div class="eta"><div><strong>08:43</strong><small>預計抵達</small></div><div>31 分鐘</div></div>`},
{d:30,time:'08:25',bat:58,sound:'soft',html:`<h2>導航重新計算</h2><div class="big">路況有些變慢</div><div class="map"><div class="road r1"></div><div class="road r2"></div><div class="route"></div><div class="dot start" style="left:145px;top:118px"></div><div class="dot end"></div></div><div class="eta"><div><strong>08:51</strong><small>預計抵達</small></div><div class="delay">+8 分鐘</div></div>`},
{d:35,time:'08:34',bat:47,sound:'notify',html:`<h2>通知</h2><div class="big">手機亮了一下</div><div class="notice-stack"><div class="notice"><div class="avatar">群</div><div><div class="n-title">今天的會議</div><div class="n-text">大家都到了，你快到了嗎？</div></div></div><div class="notice"><div class="avatar">主</div><div><div class="n-title">主管</div><div class="n-text">今天 09:00 準時開始。</div></div></div></div>`},
{d:35,time:'08:41',bat:39,sound:'notify',html:`<h2>車輛暫停</h2><div class="big">前方目前無法通行</div><div class="sub">司機沒有說需要等多久。</div><div class="notice-stack"><div class="notice urgent"><div class="avatar">!</div><div><div class="n-title">導航</div><div class="n-text">預計抵達時間已更新為 <b>09:02</b></div></div></div></div>`},
{d:30,time:'08:49',bat:27,sound:'call',dark:true,html:`<div class="call"><div class="avatar">主</div><div class="who">主管</div><div class="label">來電中…</div><div class="call-actions"><div><div class="circle reject">✕</div><div class="label">拒絕</div></div><div><div class="circle">✓</div><div class="label">接聽</div></div></div></div>`},
{d:40,time:'08:56',bat:12,sound:'low',html:`<h2>導航</h2><div class="big">剩下 600 公尺</div><div class="sub">你已經看得到目的地附近的大樓，但車幾乎沒有移動。</div><div class="map"><div class="road r1"></div><div class="road r2"></div><div class="route"></div><div class="dot start" style="left:260px;top:220px"></div><div class="dot end"></div></div><div class="eta"><div><strong>09:02</strong><small>預計抵達</small></div><div class="delay">電量 12%</div></div>`},
{d:35,time:'08:58',bat:9,sound:'notify',html:`<h2>通知</h2><div class="big">又一則訊息</div><div class="notice-stack"><div class="notice urgent"><div class="avatar">主</div><div><div class="n-title">主管</div><div class="n-text">你在哪？今天真的不能遲到。</div></div></div><div class="notice"><div class="avatar">群</div><div><div class="n-title">今天的會議</div><div class="n-text">簡報已經開好了。</div></div></div></div>`},
{d:35,time:'08:59',bat:7,sound:'low',html:`<h2>時間</h2><div class="big" style="font-size:5.3rem;margin-top:115px;text-align:center">08:59</div><div class="sub" style="text-align:center;margin-top:28px">畫面沒有其他變化。<br>車也沒有動。</div>`},
{d:30,time:'09:00',bat:6,sound:'notify',html:`<h2>通知</h2><div class="big">09:00</div><div class="notice-stack"><div class="notice urgent"><div class="avatar">主</div><div><div class="n-title">主管</div><div class="n-text">我們先開始了。</div></div></div></div>`},
{d:12,time:'09:00',bat:6,black:true,html:`<div class="black"><div><div class="line">……</div></div></div>`},
{d:30,time:'21:47',bat:41,sound:'soft',chat:true,html:`<div class="chat"><div class="chat-head"><div class="avatar">友</div><div class="chat-name">好朋友</div></div><div class="chat-body"><div class="theirs bubble">所以你最後有跟他講嗎？</div><div class="mine bubble">還沒，我真的不知道怎麼跟他講。</div><div class="read">已讀</div><div class="compose">我覺得他最近真的很難相處…</div></div></div>`},
{d:25,time:'21:48',bat:39,sound:'notify',chat:true,html:`<div class="chat"><div class="chat-head"><div class="avatar" style="background:#ffe0dc;color:#a4413a">本</div><div class="chat-name">本人</div></div><div class="chat-body"><div class="mine bubble">我覺得他最近真的很難相處…</div><div class="read">已送出</div></div></div>`},
{d:30,time:'21:48',bat:38,sound:'none',chat:true,html:`<div class="chat"><div class="chat-head"><div class="avatar" style="background:#ffe0dc;color:#a4413a">本</div><div class="chat-name">本人</div></div><div class="chat-body"><div class="mine bubble">我覺得他最近真的很難相處…</div><div class="read">已讀</div></div></div>`},
{d:45,time:'21:49',bat:36,sound:'typing',chat:true,html:`<div class="chat"><div class="chat-head"><div class="avatar" style="background:#ffe0dc;color:#a4413a">本</div><div class="chat-name">本人</div></div><div class="chat-body"><div class="mine bubble">我覺得他最近真的很難相處…</div><div class="read">已讀</div><div class="typing"><i></i><i></i><i></i></div></div></div>`},
{d:30,time:'21:50',bat:34,sound:'call',dark:true,html:`<div class="call"><div class="avatar" style="background:#ffe0dc;color:#a4413a">本</div><div class="who">本人</div><div class="label">來電中…</div><div class="call-actions"><div><div class="circle reject">✕</div><div class="label">拒絕</div></div><div><div class="circle">✓</div><div class="label">接聽</div></div></div></div>`},
{d:20,time:'21:50',bat:34,black:true,html:`<div class="black"></div>`},
{d:25,time:'21:50',bat:34,black:true,html:`<div class="black"><div><div class="line">如果是你，<br>剛才最想做什麼？</div><div class="small">不用回答。</div></div></div>`}
];
function ensureAudio(){if(audio)return;const AC=window.AudioContext||window.webkitAudioContext;if(AC)audio=new AC()}
function tone(freq,d=.08,v=.025,type='sine'){if(!audio)return;const o=audio.createOscillator(),g=audio.createGain();o.type=type;o.frequency.value=freq;g.gain.value=v;o.connect(g);g.connect(audio.destination);o.start();g.gain.exponentialRampToValueAtTime(.0001,audio.currentTime+d);o.stop(audio.currentTime+d+.02)}
function ping(){tone(1040,.07,.022);setTimeout(()=>tone(1320,.08,.016),70)}
function call(){if(!audio)return;[0,260,520].forEach(ms=>setTimeout(()=>{tone(220,.12,.035,'triangle');setTimeout(()=>tone(180,.12,.025,'triangle'),90)},ms))}
function low(){tone(78,.55,.012,'sine')}
function stopHeartbeat(){clearInterval(heartbeatTimer);heartbeatTimer=null}
function heartbeat(ms=1300){stopHeartbeat();heartbeatTimer=setInterval(()=>{tone(72,.07,.018,'sine');setTimeout(()=>tone(58,.09,.012,'sine'),130)},ms)}
function playSound(kind){stopHeartbeat();if(kind==='notify')ping();if(kind==='call')call();if(kind==='low'){low();heartbeat(1050)}if(kind==='typing')heartbeat(1350);if(kind==='soft')tone(120,.25,.006)}
function render(s){clock.textContent=s.time;batteryText.textContent=s.bat+'%';batteryIcon.style.setProperty('--battery',s.bat+'%');batteryIcon.style.color=s.bat<=12?'#ff817b':'#dce1e5';screen.className='screen'+(s.dark?' dark':'');scene.className='scene';scene.innerHTML=s.html;requestAnimationFrame(()=>scene.classList.add('on'));playSound(s.sound||'none')}
function next(){clearTimeout(timer);if(index>=scenes.length){stopHeartbeat();phone.classList.remove('show');end.classList.add('show');return}render(scenes[index]);const d=Math.max(1700,scenes[index].d*1000*scale);index++;timer=setTimeout(next,d)}
function start(){ensureAudio();audio?.resume?.();intro.style.display='none';end.classList.remove('show');phone.classList.add('show');index=0;document.documentElement.requestFullscreen?.().catch?.(()=>{});next()}
function reset(){clearTimeout(timer);stopHeartbeat();index=0;phone.classList.remove('show');end.classList.remove('show');intro.style.display='grid'}
document.querySelector('#start').addEventListener('click',start);document.querySelector('#restart').addEventListener('click',reset);document.querySelector('#again').addEventListener('click',start);
})();
</script>
</body>
</html>
