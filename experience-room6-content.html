:rgba(255,255,255,.82);padding:8px 12px;border-radius:12px;opacity:0;transition:opacity .6s;box-shadow:0 6px 18px rgba(0,0,0,.08)}.hall-scene.show .walk-caption{opacity:1}.walker{width:66px;height:158px;position:relative}.walker .head{width:47px;height:47px;border-radius:50%;background:#efc6a5;position:absolute;top:0;left:10px}.walker .body{position:absolute;left:0;bottom:0;width:66px;height:108px;border-radius:25px 25px 10px 10px;background:#677d9e}.walker.friend .body{background:#b66d8b}.walker.friend:after{content:"";position:absolute;right:-9px;bottom:18px;width:24px;height:58px;border-radius:7px;background:#f2eee9;border:2px solid #d7c9c0}.walker.back{transform:scale(.95)}.walker.back .head{left:9px;box-shadow:inset 0 8px 0 rgba(0,0,0,.06)}.walker.back .body{border-radius:22px 22px 12px 12px;box-shadow:inset 0 10px 0 rgba(255,255,255,.08)}.walker.back:nth-child(1){transform:translateY(8px) scale(.9)}.walker.back:nth-child(2){transform:translateY(0) scale(1)}.walker.back:nth-child(3){transform:translateY(5px) scale(.94)}.walker.back:nth-child(4){transform:translateY(12px) scale(.88)}.walkers.go{transform:translate(175px,-55px) scale(.74);opacity:.82}.walk-notice{position:absolute;left:50%;top:22px;transform:translateX(-50%) translateY(-12px);width:min(430px,88vw);background:rgba(248,249,250,.95);border-radius:18px;padding:12px 14px;display:flex;align-items:center;gap:10px;box-shadow:0 12px 34px rgba(0,0,0,.18);opacity:0;transition:.5s}.walk-notice.show{opacity:1;transform:translateX(-50%) translateY(0)}.walk-notice .pav{width:38px;height:38px;border-radius:50%;background:#b66d8b;color:#fff;display:grid;place-items:center;font-weight:900}.walk-notice b{font-size:.8rem}.walk-notice span{display:block;font-size:.9rem;margin-top:2px}.walk-scene{position:absolute;inset:0;border-radius:30px;overflow:hidden;background:#0f1318;opacity:0;transition:opacity .8s}.walk-scene.show{opacity:1}.walk-photo{position:absolute;inset:0;opacity:0;transition:opacity .9s ease,transform 7s ease;transform:scale(1.02)}.walk-photo.show{opacity:1}.walk-photo img{width:100%;height:100%;object-fit:cover;display:block}.walk-photo.show img{transform:scale(1.03)}.walk-photo img{transition:transform 7s ease}.walk-card-overlay{position:absolute;left:24px;top:22px;background:rgba(255,255,255,.9);border-radius:13px;padding:9px 12px;font-size:.84rem;font-weight:850;box-shadow:0 7px 20px rgba(0,0,0,.12);z-index:2}.walk-notice.real{top:auto;bottom:24px;left:24px;transform:none;width:min(470px,90vw)}.walk-notice.real.show{transform:none}.walk-soft-vignette{position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.05),rgba(0,0,0,.12));pointer-events:none}
.perform-stage{width:min(1080px,94vw);height:min(680px,80vh);border-radius:28px;overflow:hidden;background:linear-gradient(180deg,#251f35,#0d0c12);box-shadow:0 30px 100px rgba(0,0,0,.55);position:relative}.spot{position:absolute;top:-80px;width:420px;height:620px;background:linear-gradient(180deg,rgba(255,244,200,.38),rgba(255,244,200,0));clip-path:polygon(45% 0,55% 0,100% 100%,0 100%)}.spot.a{left:7%}.spot.b{right:7%}.performers{position:absolute;left:50%;bottom:72px;transform:translateX(-50%);display:flex;gap:120px}.performer{width:100px;height:280px;position:relative}.performer .head{position:absolute;top:0;left:22px;width:58px;height:58px;border-radius:50%;background:#efc5a2}.performer .body{position:absolute;left:0;bottom:0;width:100px;height:215px;border-radius:36px 36px 12px 12px;background:#6f78a5}.performer.friend .body{background:#9c6078}
.lock{width:min(440px,92vw);height:min(850px,90vh);border-radius:42px;padding:10px;background:#0b0d10;box-shadow:0 34px 100px rgba(0,0,0,.6)}.lockscreen{height:100%;border-radius:34px;overflow:hidden;position:relative;background:radial-gradient(circle at 50% 24%,#78839d,#2b3241 54%,#11151c);padding:54px 16px 24px}.lock-time{text-align:center;color:#fff;font-size:clamp(4.6rem,16vw,7.6rem);font-weight:300;letter-spacing:-.07em;font-variant-numeric:tabular-nums}.lock-date{text-align:center;color:#edf1f6;font-size:1rem;margin-top:-6px}.birthday-card{margin:22px auto 0;width:min(320px,84%);background:rgba(255,255,255,.17);backdrop-filter:blur(14px);border:1px solid rgba(255,255,255,.16);border-radius:17px;padding:13px 16px;color:#fff;display:flex;align-items:center;gap:12px;transition:.6s}.birthday-card .cake{font-size:1.8rem}.birthday-card b{display:block;font-size:.92rem}.birthday-card span{font-size:.78rem;color:#e2e6ed}.birthday-card.gone{opacity:0;transform:translateY(-8px)}.notifications{position:absolute;left:14px;right:14px;bottom:28px;display:flex;flex-direction:column;gap:9px}.notice{background:rgba(245,247,250,.9);color:#15181c;border-radius:15px;padding:10px 12px;display:flex;gap:10px;align-items:center;opacity:0;transform:translateY(9px);animation:noticeIn .5s ease forwards;box-shadow:0 7px 25px rgba(0,0,0,.14)}.notice .icon{width:38px;height:38px;border-radius:10px;background:#e1e4e8;display:grid;place-items:center;font-size:.72rem;font-weight:950}.notice b{display:block;font-size:.76rem}.notice span{font-size:.82rem;color:#3c4249;display:block;margin-top:2px}

<body>
<main class="app"><div class="corner">第6間體驗</div><button class="restart" id="restart">重來</button><div class="scene" id="scene"></div><div class="end" id="end"><div><h2>結束</h2><button class="again" id="again">再播放一次</button></div></div><div class="overlay" id="intro"><div class="intro"><div class="num">6</div><h1>第6間體驗</h1><button class="start" id="start">開始</button></div></div></main>
<script>
(()=>{
const demo=new URLSearchParams(location.search).get('demo')==='1',scene=document.querySelector('#scene'),intro=document.querySelector('#intro'),end=document.querySelector('#end');let timers=[];
function ms(n){return demo?Math.max(360,n*.22):n}function later(fn,n){const id=setTimeout(fn,ms(n));timers.push(id);return id}function clearTimers(){timers.forEach(clearTimeout);timers=[]}function show(html){scene.className='scene';scene.innerHTML=html;requestAnimationFrame(()=>scene.classList.add('on'))}function hide(next,n=900){scene.classList.remove('on');later(()=>{scene.innerHTML='';next&&next()},n)}function black(next,n=2600){show('<div class="black"></div>');later(()=>hide(next,500),n)}
function groupShell(){return '<div class="phone-wrap"><div class="phone"><div class="notch"></div><div class="status"><span>18:42</span><span>5G　78%</span></div><div class="appbar"><div class="avatar">群</div><div><h3>朋友們</h3><div class="sub">8 位成員</div></div></div><div class="chat" id="chat"></div></div></div>'}
function addMsg(name,text,delay,mine=false,color='#6877a8'){later(()=>{const chat=document.querySelector('#chat');if(!chat)return;const row=document.createElement('div');row.className='msgrow '+(mine?'me':'other');if(mine)row.innerHTML='<div class="msgcol"><div class="bubble">'+text+'</div></div>';else row.innerHTML='<div class="mini-avatar" style="background:'+color+'">'+name.slice(0,1)+'</div><div class="msgcol"><div class="name">'+name+'</div><div class="bubble">'+text+'</div></div>';chat.appendChild(row)},delay)}
function scene1(){show(groupShell());addMsg('','今天晚上有人要一起吃飯嗎？',500,true);later(()=>{const c=document.querySelector('#chat');if(c){const r=document.createElement('div');r.className='read';r.id='read';r.textContent='已讀 1';c.appendChild(r)}},1400);[['已讀 3',3200],['已讀 5',5000],['已讀 7',6900]].forEach(([t,d])=>later(()=>{const r=document.querySelector('#read');if(r)r.textContent=t},d));addMsg('阿哲','晚上火鍋？',9800,false,'#5674a6');addMsg('庭萱','我可以',10800,false,'#b66d8b');addMsg('小安','+1',11600,false,'#6e9772');addMsg('子晴','哈哈哈走啊',12400,false,'#b58654');addMsg('柏勳','哪一家？',13300,false,'#7660a4');addMsg('阿哲','我晚點到',14200,false,'#5674a6');later(()=>hide(()=>black(scene2)),18000)}
function scene2(){show('<div class="story-phone"><div class="story-screen"><div class="story-progress"><i></i><i></i><i></i></div><div class="story-head"><div class="pic">庭</div><span>庭萱　·　剛剛</span></div><div class="party-table"></div><div class="story-text">臨時揪火鍋成功 🍲<div class="story-tag">@阿哲　@小安　@子晴　@柏勳</div></div><div class="story-nav">1/1</div></div></div>');later(()=>hide(()=>black(scene3)),11000)}
function privateShell(){return '<div class="phone-wrap"><div class="phone"><div class="notch"></div><div class="status"><span id="phoneTime">12:42</span><span>5G　64%</span></div><div class="appbar"><div class="avatar" style="background:#b66d8b">佳</div><div><h3>佳怡</h3><div class="sub">上線中</div></div></div><div class="chat" id="chat"></div><div class="draft-note" id="draftNote">尚未送出</div><div class="composer"><div class="inputfake" id="inputfake"><span id="draft"></span><span class="cursor"></span></div><div class="send">↑</div></div></div></div>'}
function setDraft(text,focus=true){const d=document.querySelector('#draft'),i=document.querySelector('#inputfake'),n=document.querySelector('#draftNote');if(d)d.textContent=text;if(i)i.classList.toggle('focus',focus);if(n)n.classList.toggle('show',!!text)}
function typeDraft(text,start,step=380){text.split('').forEach((_,i)=>later(()=>setDraft(text.slice(0,i+1)),start+i*step))}function eraseDraft(text,start,step=700){for(let i=text.length-1;i>=0;i--)later(()=>setDraft(text.slice(0,i)),start+(text.length-1-i)*step)}
function scene3(){show(privateShell());addMsg('佳怡','明天一起吃飯嗎？',500,false,'#b66d8b');addMsg('','好啊',1800,true);addMsg('佳怡','那明天見～',3000,false,'#b66d8b');later(()=>{const t=document.querySelector('#phoneTime');if(t)t.textContent='12:47'},6200);later(()=>{const c=document.querySelector('#chat');if(c){const x=document.createElement('div');x.className='typing';x.id='typing';x.innerHTML='<i></i><i></i><i></i>';c.appendChild(x)}},8000);later(()=>document.querySelector('#typing')?.remove(),10600);addMsg('佳怡','抱歉，我今天臨時有事',10800,false,'#b66d8b');addMsg('佳怡','可能沒辦法去了',12300,false,'#b66d8b');addMsg('佳怡','改天好嗎？',13800,false,'#b66d8b');typeDraft('好吧',17000,600);later(()=>setDraft('好吧'),18400);eraseDraft('好吧',21800,1100);later(()=>setDraft('',true),24800);typeDraft('沒關係',26200,520);later(()=>{const d=document.querySelector('#draft');if(d)d.textContent='';const n=document.querySelector('#draftNote');if(n)n.classList.remove('show');const i=document.querySelector('#inputfake');if(i)i.classList.remove('focus');addMsg('','沒關係',0,true)},29200);later(()=>hide(()=>black(scene4)),33000)}
