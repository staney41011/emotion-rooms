<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate, max-age=0">
<meta http-equiv="Pragma" content="no-cache"><meta http-equiv="Expires" content="0">
<title>第6間體驗</title>
<style>
:root{color-scheme:dark;--bg:#05070a;--ink:#f4f6f8;--muted:#8f98a3;--green:#86e66f;--blue:#4a9eff}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--bg);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans TC",sans-serif;color:var(--ink)}button{font:inherit}
.app{position:relative;width:100%;height:100%;display:grid;place-items:center;background:radial-gradient(circle at 50% 24%,#17202b 0,#090d12 44%,#040506 100%)}
.scene{position:absolute;inset:0;display:grid;place-items:center;opacity:0;pointer-events:none;transition:opacity 1s ease}.scene.on{opacity:1}.black{position:absolute;inset:0;background:#020304}.corner{position:absolute;z-index:60;left:18px;top:16px;color:rgba(255,255,255,.34);font-size:.8rem;font-weight:800;letter-spacing:.04em}.restart{position:absolute;z-index:60;right:16px;top:11px;border:1px solid rgba(255,255,255,.10);background:rgba(0,0,0,.28);color:rgba(255,255,255,.55);border-radius:11px;padding:7px 10px;cursor:pointer}
.overlay{position:absolute;z-index:80;inset:0;background:radial-gradient(circle at 50% 36%,#1a2330,#090d12 58%,#040506);display:grid;place-items:center}.intro{text-align:center}.num{width:72px;height:72px;margin:auto;border-radius:23px;background:#edf3fa;color:#10151b;display:grid;place-items:center;font-size:2rem;font-weight:950}.intro h1{font-size:clamp(2.8rem,8vw,5.2rem);margin:24px 0 22px;letter-spacing:-.05em}.start{border:0;border-radius:17px;background:#edf3fa;color:#10151b;padding:16px 32px;font-weight:950;font-size:1.08rem;cursor:pointer}.end{display:none;position:absolute;z-index:70;inset:0;background:#020304;place-items:center;text-align:center}.end.show{display:grid}.end h2{font-size:clamp(3rem,9vw,6rem);margin:0}.again{margin-top:28px;border:1px solid #30343a;background:#101318;color:#eee;border-radius:14px;padding:12px 18px;cursor:pointer}
.phone-wrap{width:min(440px,92vw);height:min(850px,90vh);border-radius:42px;padding:10px;background:#0b0d10;box-shadow:0 34px 100px rgba(0,0,0,.6),inset 0 0 0 1px rgba(255,255,255,.08)}.phone{width:100%;height:100%;border-radius:34px;overflow:hidden;background:#f5f5f7;color:#18191b;display:flex;flex-direction:column;position:relative}.status{height:33px;display:flex;align-items:center;justify-content:space-between;padding:0 18px;font-size:.74rem;font-weight:800}.notch{position:absolute;top:8px;left:50%;transform:translateX(-50%);width:114px;height:24px;border-radius:16px;background:#0d0e10;z-index:3}.appbar{height:64px;display:flex;align-items:center;gap:11px;padding:8px 14px;border-bottom:1px solid #dedfe2;background:#fff}.avatar{width:39px;height:39px;border-radius:50%;display:grid;place-items:center;color:#fff;font-size:.78rem;font-weight:900;background:linear-gradient(135deg,#5b8cff,#865ee8);flex:0 0 auto}.appbar h3{margin:0;font-size:1rem}.appbar .sub{font-size:.72rem;color:#8c9299;margin-top:2px}.chat{flex:1;padding:15px 12px 24px;overflow:hidden;background:#eef0f3;display:flex;flex-direction:column;gap:7px}.msgrow{display:flex;align-items:flex-end;gap:7px;opacity:0;transform:translateY(7px);animation:pop .35s ease forwards}.msgrow.me{justify-content:flex-end}.mini-avatar{width:29px;height:29px;border-radius:50%;display:grid;place-items:center;color:#fff;font-size:.62rem;font-weight:850;background:#6877a8;flex:0 0 auto}.msgcol{max-width:78%}.name{font-size:.69rem;color:#7d848b;margin:0 0 3px 4px}.bubble{padding:9px 12px;border-radius:17px;font-size:.92rem;line-height:1.45;box-shadow:0 1px 0 rgba(0,0,0,.04)}.msgrow.me .bubble{background:var(--green);border-bottom-right-radius:5px}.msgrow.other .bubble{background:#fff;border-bottom-left-radius:5px}.read{align-self:flex-end;color:#8f969d;font-size:.7rem;margin:-2px 5px 2px 0;min-height:16px}.typing{align-self:flex-start;background:#fff;border-radius:17px;padding:11px 14px;display:none}.typing.show{display:block}.typing i{display:inline-block;width:6px;height:6px;border-radius:50%;background:#a7adb4;margin:0 2px;animation:blink 1s infinite}.typing i:nth-child(2){animation-delay:.15s}.typing i:nth-child(3){animation-delay:.3s}.composer{height:56px;background:#fff;border-top:1px solid #dfe3e6;padding:9px 12px;display:flex;align-items:center;gap:8px}.inputfake{flex:1;background:#f2f3f5;border:1px solid #dde1e5;border-radius:20px;padding:8px 12px;color:#202328;font-size:.9rem}.send{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;background:#2f86ff;color:#fff;font-weight:900}
.story-phone{width:min(430px,92vw);height:min(820px,88vh);border-radius:34px;background:#08090b;padding:10px;box-shadow:0 34px 100px rgba(0,0,0,.6)}.story-screen{height:100%;border-radius:26px;overflow:hidden;position:relative;background:#111}.story-progress{position:absolute;left:10px;right:10px;top:10px;height:3px;display:flex;gap:4px;z-index:5}.story-progress i{flex:1;background:rgba(255,255,255,.25);border-radius:4px;overflow:hidden}.story-progress i::after{content:"";display:block;height:100%;width:100%;background:#fff}.story-head{position:absolute;top:22px;left:16px;z-index:5;display:flex;align-items:center;gap:9px;color:#fff;font-size:.85rem;font-weight:800;text-shadow:0 1px 8px rgba(0,0,0,.6)}.story-head .pic{width:34px;height:34px;border-radius:50%;background:linear-gradient(135deg,#ff9a76,#806de8);display:grid;place-items:center}.story-bg{position:absolute;inset:0;background:linear-gradient(145deg,#e8a26e,#6b82bd);display:grid;place-items:center}.party-table{width:82%;height:46%;border-radius:28px;background:radial-gradient(circle at 45% 45%,#d04c45 0 9%,transparent 10%),radial-gradient(circle at 58% 52%,#d7a36b 0 8%,transparent 9%),linear-gradient(145deg,#4b2d20,#2b1712);box-shadow:0 20px 55px rgba(0,0,0,.38);position:relative}.party-table::before{content:"🍲  🥤  🥢";position:absolute;inset:0;display:grid;place-items:center;font-size:clamp(2rem,7vw,4.4rem)}.story-text{position:absolute;left:24px;right:24px;bottom:60px;text-align:center;color:#fff;font-size:clamp(1.6rem,5vw,2.7rem);font-weight:950;text-shadow:0 3px 15px rgba(0,0,0,.55)}.story-tag{display:inline-block;margin-top:12px;background:rgba(0,0,0,.34);padding:8px 12px;border-radius:12px;font-size:1rem}.story-counter{position:absolute;right:18px;bottom:16px;color:rgba(255,255,255,.7);font-size:.82rem}
.walk-scene{width:min(1040px,94vw);height:min(660px,78vh);border-radius:30px;overflow:hidden;background:#dfe6ec;box-shadow:0 30px 90px rgba(0,0,0,.5);position:relative;color:#18202a}.hall{position:absolute;inset:0;background:linear-gradient(180deg,#eaf1f5 0 58%,#aeb7bf 58% 61%,#848d94 61%)}.doors{position:absolute;left:0;right:0;top:80px;display:flex;justify-content:space-around}.door{width:150px;height:240px;background:#bdc7ce;border:8px solid #8c969e;border-bottom:0}.deskline{position:absolute;left:8%;right:8%;bottom:190px;height:80px;background:#b68b63;border-radius:12px}.bag{position:absolute;left:17%;bottom:215px;width:70px;height:55px;border-radius:12px;background:#3e4d5b}.walkers{position:absolute;right:7%;bottom:88px;display:flex;gap:18px;align-items:flex-end;transition:transform 7s linear}.walker{width:62px;height:150px;position:relative}.walker .head{width:46px;height:46px;border-radius:50%;background:#efc6a5;position:absolute;top:0;left:8px}.walker .body{position:absolute;left:0;bottom:0;width:62px;height:103px;border-radius:25px 25px 10px 10px;background:#647a9b}.walker:nth-child(2) .body{background:#a66c7e}.walker:nth-child(3) .body{background:#668b67}.walkers.go{transform:translateX(220px)}.walk-chat{position:absolute;left:28px;top:24px;width:min(360px,68vw);background:#fff;border-radius:18px;padding:14px 16px;box-shadow:0 12px 30px rgba(0,0,0,.13)}.walk-chat b{display:block;font-size:.78rem;color:#8a9198;margin-bottom:5px}.walk-chat span{font-size:1.02rem;font-weight:800}
.perform-stage{width:min(1080px,94vw);height:min(680px,80vh);border-radius:28px;overflow:hidden;background:linear-gradient(180deg,#251f35,#0d0c12);box-shadow:0 30px 100px rgba(0,0,0,.55);position:relative}.spot{position:absolute;top:-80px;width:420px;height:620px;background:linear-gradient(180deg,rgba(255,244,200,.38),rgba(255,244,200,0));clip-path:polygon(45% 0,55% 0,100% 100%,0 100%)}.spot.a{left:7%}.spot.b{right:7%}.performers{position:absolute;left:50%;bottom:72px;transform:translateX(-50%);display:flex;gap:120px}.performer{width:100px;height:280px;position:relative}.performer .head{position:absolute;top:0;left:22px;width:58px;height:58px;border-radius:50%;background:#efc5a2}.performer .body{position:absolute;left:0;bottom:0;width:100px;height:215px;border-radius:36px 36px 12px 12px;background:#6f78a5}.performer.friend .body{background:#9c6078}.stage-caption{position:absolute;left:30px;right:30px;bottom:24px;text-align:center;color:rgba(255,255,255,.65);font-size:.88rem}.story-stack{width:min(440px,92vw);height:min(820px,88vh);border-radius:34px;background:#08090b;padding:10px;box-shadow:0 34px 100px rgba(0,0,0,.6)}.story-card{height:100%;border-radius:26px;overflow:hidden;position:relative;background:linear-gradient(155deg,#4a4365,#15131c);display:grid;place-items:center}.story-card .stage-mini{width:82%;height:54%;border-radius:20px;background:linear-gradient(180deg,#443b5d,#121017);position:relative;overflow:hidden}.stage-mini::before{content:"🎤        🎤";position:absolute;inset:0;display:grid;place-items:center;font-size:clamp(2.4rem,9vw,4.6rem)}.tag-focus{position:absolute;left:55%;top:35%;transform:translate(-50%,-50%);background:#fff;color:#111;padding:7px 11px;border-radius:8px;font-weight:900;font-size:.92rem}.story-comment{position:absolute;left:24px;right:24px;bottom:66px;color:#fff;text-align:center;font-size:clamp(1.3rem,4vw,2rem);font-weight:950}.story-comment small{display:block;font-size:.9rem;margin-top:9px;color:#d8dbe2}.story-nav{position:absolute;right:18px;bottom:16px;color:#aab0ba;font-size:.82rem}
.lock{width:min(440px,92vw);height:min(850px,90vh);border-radius:42px;padding:10px;background:#0b0d10;box-shadow:0 34px 100px rgba(0,0,0,.6)}.lockscreen{height:100%;border-radius:34px;overflow:hidden;position:relative;background:radial-gradient(circle at 50% 24%,#6e7894,#252b38 54%,#11151c);padding:56px 18px 24px}.lock-time{text-align:center;color:#fff;font-size:clamp(4.6rem,16vw,7.6rem);font-weight:300;letter-spacing:-.07em;font-variant-numeric:tabular-nums}.lock-date{text-align:center;color:#edf1f6;font-size:1rem;margin-top:-6px}.notifications{position:absolute;left:14px;right:14px;bottom:28px;display:flex;flex-direction:column;gap:10px}.notice{background:rgba(244,247,250,.88);backdrop-filter:blur(18px);color:#17202a;border-radius:18px;padding:12px 14px;display:flex;gap:11px;align-items:flex-start;opacity:0;transform:translateY(8px);animation:noticeIn .4s ease forwards}.notice .icon{width:36px;height:36px;border-radius:9px;background:#64748b;display:grid;place-items:center;color:#fff;font-weight:900;flex:0 0 auto}.notice b{display:block;font-size:.85rem}.notice span{display:block;color:#5f6872;font-size:.81rem;margin-top:2px;line-height:1.35}
@keyframes pop{to{opacity:1;transform:none}}@keyframes fade{to{opacity:1}}@keyframes blink{0%,70%,100%{opacity:.3;transform:translateY(0)}35%{opacity:1;transform:translateY(-2px)}}@keyframes noticeIn{to{opacity:1;transform:none}}
@media(max-width:600px){.phone-wrap,.lock{height:92vh;border-radius:30px}.phone,.lockscreen{border-radius:23px}.performers{gap:65px}.walk-scene{height:72vh}.walkers{right:-4%}.story-phone,.story-stack{height:90vh}}
</style>
</head>
<body>
<main class="app">
<div class="corner">第6間體驗</div><button class="restart" id="restart" type="button">重來</button>
<div class="scene" id="scene"></div>
<div class="end" id="end"><div><h2>結束</h2><button class="again" id="again" type="button">再播放一次</button></div></div>
<div class="overlay" id="intro"><div class="intro"><div class="num">6</div><h1>第6間體驗</h1><button class="start" id="start" type="button">開始</button></div></div>
</main>
<script>
(()=>{
const demo=new URLSearchParams(location.search).get('demo')==='1';
const scene=document.querySelector('#scene'),intro=document.querySelector('#intro'),end=document.querySelector('#end');
let timers=[],audio=null;
function ms(n){return demo?Math.max(420,n*.20):n}
function later(fn,n){const id=setTimeout(fn,ms(n));timers.push(id);return id}
function clearTimers(){timers.forEach(clearTimeout);timers=[]}
function ensureAudio(){if(audio)return;const AC=window.AudioContext||window.webkitAudioContext;if(AC)audio=new AC()}
function ping(freq=740){if(!audio)return;const o=audio.createOscillator(),g=audio.createGain();o.type='sine';o.frequency.value=freq;g.gain.value=.018;o.connect(g);g.connect(audio.destination);o.start();g.gain.exponentialRampToValueAtTime(.0001,audio.currentTime+.08);o.stop(audio.currentTime+.09)}
function show(html){scene.className='scene';scene.innerHTML=html;requestAnimationFrame(()=>scene.classList.add('on'))}
function hide(next,n=1000){scene.classList.remove('on');later(()=>{scene.innerHTML='';next?.()},n)}
function black(next,n=2800){show('<div class="black"></div>');later(()=>hide(next,500),n)}
function addMsg(name,text,delay,me=false,color='#6a78a8'){later(()=>{const chat=document.querySelector('#chat');if(!chat)return;const row=document.createElement('div');row.className='msgrow '+(me?'me':'other');row.innerHTML=me?`<div class="msgcol"><div class="bubble">${text}</div></div>`:`<div class="mini-avatar" style="background:${color}">${name.slice(0,1)}</div><div class="msgcol"><div class="name">${name}</div><div class="bubble">${text}</div></div>`;chat.appendChild(row);chat.scrollTop=chat.scrollHeight;ping(me?880:680)},delay)}
function phoneShell(title='朋友們',sub='8 位成員',privateMode=false){return `<div class="phone-wrap"><div class="phone"><div class="notch"></div><div class="status"><span id="phoneTime">18:42</span><span>5G　78%</span></div><div class="appbar"><div class="avatar">${privateMode?'友':'群'}</div><div><h3>${title}</h3><div class="sub">${sub}</div></div></div><div class="chat" id="chat"></div><div class="composer"><div class="inputfake" id="inputfake"></div><div class="send">↑</div></div></div></div>`}
function scene1(){
 show(phoneShell());addMsg('', '今天晚上有人要一起吃飯嗎？',500,true);
 later(()=>{const r=document.createElement('div');r.className='read';r.id='readCount';r.textContent='已讀 1';document.querySelector('#chat')?.appendChild(r)},1600);
 [['已讀 3',3600],['已讀 5',5900],['已讀 7',8200]].forEach(([t,d])=>later(()=>{const r=document.querySelector('#readCount');if(r)r.textContent=t},d));
 addMsg('阿哲','晚上火鍋？',11800,false,'#5d7fc9');addMsg('庭萱','我可以',12900,false,'#b56b8a');addMsg('小安','+1',13800,false,'#5a9973');addMsg('子晴','哈哈哈走啊',14700,false,'#b07b4f');addMsg('柏勳','哪一家？',15800,false,'#6a70ad');addMsg('阿哲','我晚點到',16900,false,'#5d7fc9');
 later(()=>hide(()=>black(scene2)),21000)
}
function scene2(){
 show(`<div class="story-phone"><div class="story-screen"><div class="story-progress"><i></i></div><div class="story-head"><div class="pic">庭</div><span>庭萱　·　剛剛</span></div><div class="story-bg"><div class="party-table"></div></div><div class="story-text">今天超開心 ❤️<div class="story-tag">@阿哲　@小安　@子晴　@柏勳</div></div><div class="story-counter">火鍋局 🍲</div></div></div>`);
 later(()=>hide(()=>black(scene3)),14500)
}
function scene3(){
 show(phoneShell('佳怡','上線中',true));
 const chat=document.querySelector('#chat');
 later(()=>addMsg('佳怡','明天一起吃飯嗎？',0,false,'#9a6885'),500);
 addMsg('', '好啊',1900,true);addMsg('佳怡','那明天見～',3200,false,'#9a6885');
 later(()=>{const t=document.querySelector('#phoneTime');if(t)t.textContent='12:47'},6500);
 later(()=>{const typing=document.createElement('div');typing.className='typing show';typing.id='typing';typing.innerHTML='<i></i><i></i><i></i>';chat?.appendChild(typing)},8200);
 later(()=>document.querySelector('#typing')?.remove(),11100);
 addMsg('佳怡','抱歉，我今天臨時有事',11300,false,'#9a6885');addMsg('佳怡','可能沒辦法去了',12800,false,'#9a6885');addMsg('佳怡','改天好嗎？',14300,false,'#9a6885');
 later(()=>{const input=document.querySelector('#inputfake');if(input)input.textContent='好吧'},17100);
 later(()=>{const input=document.querySelector('#inputfake');if(input)input.textContent=''},18400);
 later(()=>{const input=document.querySelector('#inputfake');if(input)input.textContent='沒關係'},19800);
 addMsg('', '沒關係',21800,true);
 later(()=>hide(()=>black(scene4)),25500)
}
function scene4(){
 show(`<div class="walk-scene"><div class="hall"><div class="doors"><div class="door"></div><div class="door"></div><div class="door"></div></div><div class="deskline"></div><div class="bag"></div><div class="walk-chat"><b>18:03 · 佳怡</b><span>等等一起走</span></div><div class="walkers" id="walkers"><div class="walker"><div class="head"></div><div class="body"></div></div><div class="walker"><div class="head"></div><div class="body"></div></div><div class="walker"><div class="head"></div><div class="body"></div></div></div></div></div>`);
 later(()=>document.querySelector('#walkers')?.classList.add('go'),6500);
 later(()=>hide(()=>black(scene5)),15500)
}
function scene5(){
 show(`<div class="perform-stage"><div class="spot a"></div><div class="spot b"></div><div class="performers"><div class="performer"><div class="head"></div><div class="body"></div></div><div class="performer friend"><div class="head"></div><div class="body"></div></div></div><div class="stage-caption">演出結束</div></div>`);
 later(()=>hide(storyA),6500)
}
function storyShell(owner,comment,tag,idx){return `<div class="story-stack"><div class="story-card"><div class="story-progress"><i></i><i></i><i></i><i></i></div><div class="story-head"><div class="pic">${owner.slice(0,1)}</div><span>${owner}　·　剛剛</span></div><div class="stage-mini"></div>${tag?`<div class="tag-focus">${tag}</div>`:''}<div class="story-comment">${comment}</div><div class="story-nav">${idx}/4</div></div></div>`}
function storyA(){show(storyShell('庭萱','阿哲今天真的太強了 🔥','@阿哲',1));later(()=>hide(storyB,450),6200)}
function storyB(){show(storyShell('子晴','今天最精彩就是這段','@阿哲',2));later(()=>hide(storyC,450),6200)}
function storyC(){show(storyShell('柏勳','這現場也太穩 👏','@阿哲',3));later(()=>hide(storyD,450),6200)}
function storyD(){show(storyShell('小安','今天辛苦了 🤍<small>@阿哲</small>','',4));later(()=>hide(()=>black(scene6)),8200)}
function scene6(){
 show(`<div class="lock"><div class="lockscreen"><div class="lock-time" id="lockTime">11:50</div><div class="lock-date">星期日 · 8月30日</div><div class="notifications" id="notifications"></div></div></div>`);
 const notes=[
  [1800,'購','購物','你關注的商品正在特價'],
  [6200,'群','朋友們','阿哲：照片傳一下啦'],
  [10500,'社','社群','你有 3 則新的限時動態'],
  [14600,'系','系統','電量剩餘 31%']
 ];
 const times=[['11:55',4500],['11:58',9000],['11:59',13700],['12:00',19000]];
 notes.forEach(([dIcon,app,text],i)=>later(()=>{const box=document.querySelector('#notifications');if(!box)return;const n=document.createElement('div');n.className='notice';n.innerHTML=`<div class="icon">${dIcon}</div><div><b>${app}</b><span>${text}</span></div>`;box.prepend(n);ping(720+i*40)},i===0?1800:notes[i][0]));
 times.forEach(([t,d])=>later(()=>{const el=document.querySelector('#lockTime');if(el)el.textContent=t},d));
 later(()=>{const box=document.querySelector('#notifications');if(box)box.style.opacity='.35'},20500);
 later(()=>hide(()=>black(finish,5200)),25500)
}
function finish(){end.classList.add('show')}
function start(){clearTimers();ensureAudio();audio?.resume?.();intro.style.display='none';end.classList.remove('show');scene.className='scene';scene.innerHTML='';document.documentElement.requestFullscreen?.().catch?.(()=>{});black(scene1,1600)}
function reset(){clearTimers();scene.className='scene';scene.innerHTML='';end.classList.remove('show');intro.style.display='grid'}
document.querySelector('#start').addEventListener('click',start);document.querySelector('#restart').addEventListener('click',reset);document.querySelector('#again').addEventListener('click',start);
})();
</script>
</body>
</html>
