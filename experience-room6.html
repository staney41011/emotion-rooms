<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
  <meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate, max-age=0">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <title>第6間體驗</title>
  <style>
    :root{color-scheme:dark;--bg:#0b0910;--text:#f8f5fb;--muted:#a7a0b1;--line:rgba(255,255,255,.12);--accent:#b9a5ff}
    *{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--bg);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans TC",sans-serif;color:var(--text)}button{font:inherit}button:focus-visible{outline:3px solid #fff;outline-offset:3px}
    .app{position:relative;width:100%;height:100%;background:#0b0910}.canvas-wrap{position:absolute;inset:0}canvas{display:block;width:100%;height:100%}
    .top{position:absolute;z-index:4;top:0;left:0;right:0;height:60px;display:flex;align-items:center;justify-content:space-between;padding:0 20px;color:rgba(255,255,255,.54);background:linear-gradient(180deg,rgba(5,4,8,.68),transparent);pointer-events:none;transition:opacity .4s}.brand{font-weight:900;letter-spacing:.05em}.meta{display:flex;align-items:center;gap:12px;font-size:.85rem}.time{font-variant-numeric:tabular-nums;font-weight:900}.restart{pointer-events:auto;border:1px solid rgba(255,255,255,.1);background:rgba(255,255,255,.05);color:rgba(255,255,255,.62);border-radius:11px;padding:7px 10px;cursor:pointer}
    .progress{position:absolute;z-index:5;top:0;left:0;right:0;height:3px;background:rgba(255,255,255,.05)}.progress i{display:block;height:100%;width:0;background:linear-gradient(90deg,#8a72e6,#d1c6ff)}
    .overlay{position:absolute;inset:0;z-index:8;display:grid;place-items:center;padding:24px;background:radial-gradient(circle at 50% 38%,#211a30,#0b0910 58%,#07060a)}.intro{width:min(720px,94vw);text-align:center}.num{display:inline-grid;place-items:center;width:68px;height:68px;border-radius:22px;background:#f3efff;color:#211843;font-size:2rem;font-weight:950;box-shadow:0 18px 60px rgba(173,149,255,.22)}.intro h1{font-size:clamp(2.8rem,8vw,5.8rem);letter-spacing:-.05em;margin:24px 0 12px}.intro p{max-width:590px;margin:0 auto;color:#aaa2b5;font-size:clamp(1rem,2vw,1.22rem);line-height:1.8}.start{margin-top:32px;border:0;border-radius:18px;background:#f3efff;color:#211843;padding:17px 32px;font-weight:950;font-size:1.15rem;cursor:pointer;box-shadow:0 16px 44px rgba(173,149,255,.14)}
    .end{position:absolute;inset:0;z-index:7;display:none;place-items:center;text-align:center;background:#0b0910}.end.show{display:grid}.end h2{font-size:clamp(3rem,9vw,7rem);margin:0;letter-spacing:-.05em}.end p{color:#827b8c;margin:18px 0 28px}.again{border:1px solid var(--line);border-radius:16px;background:#f3efff;color:#211843;padding:14px 22px;font-weight:900;cursor:pointer}
    @media(max-width:650px){.top{padding:0 11px}.meta span:first-child{display:none}}
    @media(prefers-reduced-motion:reduce){.top{transition:none}}
  </style>
</head>
<body>
<main class="app" id="app">
  <div class="canvas-wrap"><canvas id="canvas"></canvas></div>
  <div class="progress"><i id="progress"></i></div>
  <header class="top" id="topbar"><div class="brand">第6間體驗</div><div class="meta"><span id="sceneLabel">準備中</span><span class="time" id="time">10:00</span><button class="restart" id="restart" type="button">重來</button></div></header>
  <div class="overlay" id="intro"><div class="intro"><div class="num">6</div><h1>第6間體驗</h1><p>請持續看著畫面，不需要找答案，也不需要把任何東西修好。<br>按下開始後，畫面會自動播放約 10 分鐘。</p><button class="start" id="start" type="button">開始體驗</button></div></div>
  <section class="end" id="end"><div><h2>完成</h2><p>請依現場指示前往下一步。</p><button class="again" id="again" type="button">再播放一次</button></div></section>
</main>
<script>
(() => {
  const demo=new URLSearchParams(location.search).get('demo')==='1';
  const TOTAL=demo?90000:600000;
  const canvas=document.querySelector('#canvas'),ctx=canvas.getContext('2d');
  const intro=document.querySelector('#intro'),end=document.querySelector('#end'),progress=document.querySelector('#progress'),timeEl=document.querySelector('#time'),sceneLabel=document.querySelector('#sceneLabel');
  const startBtn=document.querySelector('#start'),restartBtn=document.querySelector('#restart'),againBtn=document.querySelector('#again');
  let W=0,H=0,DPR=1,running=false,startedAt=0,sceneStarted=0,sceneDuration=9000,sceneIndex=-1,scene=null,raf=0;
  const types=['gridOffset','oddCircle','brokenRing','stripes','checker','symmetry','tileRotation','progress99','dotWave','nearCenter','sequence','clock','crookedLine','missingCorner','barAlignment'];

  function fmt(ms){const s=Math.max(0,Math.ceil(ms/1000));return `${String(Math.floor(s/60)).padStart(2,'0')}:${String(s%60).padStart(2,'0')}`}
  function resize(){DPR=Math.min(2,window.devicePixelRatio||1);W=innerWidth;H=innerHeight;canvas.width=Math.round(W*DPR);canvas.height=Math.round(H*DPR);canvas.style.width=W+'px';canvas.style.height=H+'px';ctx.setTransform(DPR,0,0,DPR,0,0)}
  function fract(x){return x-Math.floor(x)}
  function noise(seed,i){return fract(Math.sin(seed*12.9898+i*78.233)*43758.5453123)}
  function N(i){return noise(scene.seed,i)}
  function rgba(a=.8){return `rgba(30,26,36,${a})`}
  function roundedRect(x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath()}
  function base(light=true){ctx.fillStyle=light?'#f0ede8':'#111018';ctx.fillRect(0,0,W,H)}
  function centerArea(){return {x:W*.08,y:H*.12,w:W*.84,h:H*.78}}

  function chooseScene(now){sceneIndex++;const seed=(Date.now()+sceneIndex*7919)%1000000;scene={type:types[sceneIndex%types.length],seed};sceneStarted=now;sceneDuration=demo?2600:7600+Math.floor(noise(seed,1)*5200);sceneLabel.textContent=`畫面 ${sceneIndex+1}`}

  function drawGridOffset(t){base(true);const a=centerArea(),cols=9,rows=6,g=Math.min(a.w/(cols+1),a.h/(rows+1)),s=g*.54,odd=Math.floor(N(2)*cols*rows),dx=(N(3)>.5?1:-1)*(3+N(4)*8),dy=(N(5)>.5?1:-1)*(2+N(6)*7);ctx.strokeStyle=rgba(.76);ctx.lineWidth=2;let k=0;for(let r=0;r<rows;r++)for(let c=0;c<cols;c++,k++){let x=a.x+(c+1)*g-s/2,y=a.y+(r+1)*g-s/2;if(k===odd){x+=dx;y+=dy}roundedRect(x,y,s,s,4);ctx.stroke()}}
  function drawOddCircle(t){base(false);const a=centerArea(),cols=10,rows=6,g=Math.min(a.w/(cols+1),a.h/(rows+1)),rad=g*.23,odd=Math.floor(N(2)*cols*rows);ctx.strokeStyle='rgba(238,233,248,.78)';ctx.lineWidth=2;let k=0;for(let r=0;r<rows;r++)for(let c=0;c<cols;c++,k++){let x=a.x+(c+1)*g,y=a.y+(r+1)*g,rr=rad;if(k===odd){rr*=.78+N(4)*.11;x+=2+N(5)*5}ctx.beginPath();ctx.arc(x,y,rr,0,Math.PI*2);ctx.stroke()}}
  function drawBrokenRing(t){base(true);const cx=W/2,cy=H/2,max=Math.min(W,H)*.34,rings=7,odd=Math.floor(N(2)*rings);ctx.strokeStyle=rgba(.74);ctx.lineWidth=8;ctx.lineCap='round';for(let i=0;i<rings;i++){const r=max*(.22+i*.115);ctx.beginPath();if(i===odd){const gap=.10+N(5)*.10,ang=N(6)*Math.PI*2;ctx.arc(cx,cy,r,ang+gap,ang+Math.PI*2-gap)}else ctx.arc(cx,cy,r,0,Math.PI*2);ctx.stroke()}}
  function drawStripes(t){base(false);const count=24,margin=W*.09,usable=W-margin*2,step=usable/(count-1),odd=Math.floor(N(2)*count);ctx.strokeStyle='rgba(242,238,248,.68)';ctx.lineWidth=Math.max(2,step*.18);for(let i=0;i<count;i++){const x=margin+i*step,top=H*.16,bottom=H*.84;ctx.beginPath();ctx.moveTo(x,i===odd?top+18+N(3)*35:top);ctx.lineTo(x,i===odd?bottom-5-N(4)*20:bottom);ctx.stroke()}}
  function drawChecker(t){base(true);const cols=12,rows=8,size=Math.min(W*.78/cols,H*.68/rows),ox=(W-cols*size)/2,oy=(H-rows*size)/2,odd=Math.floor(N(2)*cols*rows);let k=0;for(let r=0;r<rows;r++)for(let c=0;c<cols;c++,k++){const dark=(r+c)%2===0;ctx.fillStyle=k===odd?(dark?'#403a42':'#c9c4bf'):(dark?'#312d33':'#dedad4');ctx.fillRect(ox+c*size,oy+r*size,size+.5,size+.5)}}
  function drawSymmetry(t){base(false);const cy=H/2,gap=W*.055,count=7;ctx.fillStyle='rgba(235,229,245,.78)';for(let i=0;i<count;i++){const yy=cy+(i-(count-1)/2)*Math.min(72,H*.095),w=60+N(i+10)*120,h=18+N(i+30)*26;roundedRect(W/2-gap-w,yy-h/2,w,h,6);ctx.fill();let shift=i===Math.floor(N(2)*count)?8+N(4)*12:0;roundedRect(W/2+gap+shift,yy-h/2,w,h,6);ctx.fill()}ctx.strokeStyle='rgba(255,255,255,.12)';ctx.beginPath();ctx.moveTo(W/2,H*.16);ctx.lineTo(W/2,H*.84);ctx.stroke()}
  function drawTileRotation(t){base(true);const a=centerArea(),cols=9,rows=6,g=Math.min(a.w/(cols+1),a.h/(rows+1)),s=g*.55,odd=Math.floor(N(2)*cols*rows),ang=(N(3)>.5?1:-1)*(.035+N(4)*.035);ctx.strokeStyle=rgba(.78);ctx.lineWidth=2;let k=0;for(let r=0;r<rows;r++)for(let c=0;c<cols;c++,k++){const x=a.x+(c+1)*g,y=a.y+(r+1)*g;ctx.save();ctx.translate(x,y);if(k===odd)ctx.rotate(ang);ctx.strokeRect(-s/2,-s/2,s,s);ctx.restore()}}
  function drawProgress99(t){base(false);const w=Math.min(820,W*.78),h=46,x=(W-w)/2,y=H*.48;const local=Math.min(1,t/5200),pct=Math.min(99,91+local*8);ctx.fillStyle='rgba(255,255,255,.08)';roundedRect(x,y,w,h,23);ctx.fill();ctx.fillStyle='rgba(217,207,255,.78)';roundedRect(x,y,w*(pct/100),h,23);ctx.fill();ctx.fillStyle='rgba(244,240,249,.92)';ctx.font=`900 ${Math.min(92,W*.12)}px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif`;ctx.textAlign='center';ctx.fillText(`${Math.floor(pct)}%`,W/2,y-55);ctx.fillStyle='rgba(255,255,255,.34)';ctx.font='700 18px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif';ctx.fillText(pct>=99?'還差一點…':'處理中…',W/2,y+100)}
  function drawDotWave(t){base(true);const cols=16,rows=7,a=centerArea(),sx=a.w/(cols+1),sy=a.h/(rows+1),odd=Math.floor(N(2)*cols),phase=t/700;ctx.fillStyle=rgba(.72);for(let r=0;r<rows;r++)for(let c=0;c<cols;c++){const x=a.x+(c+1)*sx,y=a.y+(r+1)*sy+Math.sin(phase+c*.55+(c===odd?1.2:0))*7;ctx.beginPath();ctx.arc(x,y,5.5,0,Math.PI*2);ctx.fill()}}
  function drawNearCenter(t){base(false);const cx=W/2,cy=H/2,count=9,odd=Math.floor(N(2)*count);ctx.strokeStyle='rgba(235,230,244,.6)';ctx.lineWidth=2;for(let i=0;i<count;i++){const r=Math.min(W,H)*(.06+i*.038),dx=i===odd?5+N(4)*8:0,dy=i===odd?-4-N(5)*7:0;ctx.beginPath();ctx.arc(cx+dx,cy+dy,r,0,Math.PI*2);ctx.stroke()}ctx.fillStyle='rgba(255,255,255,.65)';ctx.beginPath();ctx.arc(cx,cy,3,0,Math.PI*2);ctx.fill()}
  function drawSequence(t){base(true);const rows=6,cols=10,oddR=Math.floor(N(2)*rows),swap=3+Math.floor(N(3)*5),font=Math.min(38,W/24);ctx.font=`800 ${font}px ui-monospace,SFMono-Regular,Menlo,monospace`;ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillStyle=rgba(.76);const gapX=W*.78/(cols-1),gapY=H*.62/(rows-1),ox=W*.11,oy=H*.19;for(let r=0;r<rows;r++){let seq=Array.from({length:cols},(_,i)=>i+1);if(r===oddR)[seq[swap],seq[swap+1]]=[seq[swap+1],seq[swap]];for(let c=0;c<cols;c++)ctx.fillText(seq[c],ox+c*gapX,oy+r*gapY)}}
  function drawClock(t){base(false);const cx=W/2,cy=H/2,r=Math.min(W,H)*.34,odd=Math.floor(N(2)*60);ctx.strokeStyle='rgba(239,234,247,.68)';ctx.lineWidth=2;for(let i=0;i<60;i++){const a=i/60*Math.PI*2-Math.PI/2+(i===odd?.025:0),len=i%5===0?22:11;ctx.beginPath();ctx.moveTo(cx+Math.cos(a)*(r-len),cy+Math.sin(a)*(r-len));ctx.lineTo(cx+Math.cos(a)*r,cy+Math.sin(a)*r);ctx.stroke()}ctx.beginPath();ctx.arc(cx,cy,r,0,Math.PI*2);ctx.stroke()}
  function drawCrookedLine(t){base(true);const count=17,marginX=W*.12,top=H*.16,bottom=H*.84,step=(bottom-top)/(count-1),odd=Math.floor(N(2)*count);ctx.strokeStyle=rgba(.7);ctx.lineWidth=3;for(let i=0;i<count;i++){const y=top+i*step;ctx.beginPath();ctx.moveTo(marginX,y);ctx.lineTo(W-marginX,y+(i===odd?(N(3)>.5?1:-1)*(7+N(4)*12):0));ctx.stroke()}}
  function drawMissingCorner(t){base(false);const w=Math.min(W*.62,720),h=Math.min(H*.58,520),x=(W-w)/2,y=(H-h)/2,gap=18+N(2)*36;ctx.strokeStyle='rgba(240,235,247,.72)';ctx.lineWidth=8;ctx.lineCap='round';ctx.beginPath();ctx.moveTo(x+gap,y);ctx.lineTo(x+w,y);ctx.lineTo(x+w,y+h);ctx.lineTo(x,y+h);ctx.lineTo(x,y+gap);ctx.stroke()}
  function drawBarAlignment(t){base(true);const rows=11,barW=Math.min(600,W*.62),x=(W-barW)/2,top=H*.15,step=H*.7/(rows-1),odd=Math.floor(N(2)*rows);for(let i=0;i<rows;i++){const y=top+i*step,shift=i===odd?(N(3)>.5?1:-1)*(7+N(4)*14):0;ctx.fillStyle=i%2?'#4a454b':'#29262b';roundedRect(x+shift,y-10,barW,20,10);ctx.fill();ctx.fillStyle='#e1ddd7';ctx.beginPath();ctx.arc(x-28,y,5,0,Math.PI*2);ctx.fill()}}

  function draw(now){
    if(!running)return;const elapsed=now-startedAt,remain=TOTAL-elapsed,p=Math.min(1,elapsed/TOTAL);timeEl.textContent=fmt(remain);progress.style.width=(p*100).toFixed(2)+'%';
    if(elapsed>=TOTAL){finish();return}if(!scene||now-sceneStarted>=sceneDuration)chooseScene(now);const t=now-sceneStarted;
    ctx.clearRect(0,0,W,H);
    const fn={gridOffset:drawGridOffset,oddCircle:drawOddCircle,brokenRing:drawBrokenRing,stripes:drawStripes,checker:drawChecker,symmetry:drawSymmetry,tileRotation:drawTileRotation,progress99:drawProgress99,dotWave:drawDotWave,nearCenter:drawNearCenter,sequence:drawSequence,clock:drawClock,crookedLine:drawCrookedLine,missingCorner:drawMissingCorner,barAlignment:drawBarAlignment}[scene.type];fn(t);raf=requestAnimationFrame(draw)
  }
  function finish(){running=false;cancelAnimationFrame(raf);progress.style.width='100%';timeEl.textContent='00:00';sceneLabel.textContent='完成';end.classList.add('show')}
  async function fullscreen(){try{if(document.documentElement.requestFullscreen)await document.documentElement.requestFullscreen()}catch{}}
  function start(){intro.style.display='none';end.classList.remove('show');running=true;scene=null;sceneIndex=-1;startedAt=performance.now();sceneStarted=0;progress.style.width='0';fullscreen();raf=requestAnimationFrame(draw)}
  function reset(){running=false;cancelAnimationFrame(raf);end.classList.remove('show');intro.style.display='grid';sceneLabel.textContent='準備中';timeEl.textContent=fmt(TOTAL);progress.style.width='0';ctx.clearRect(0,0,W,H)}
  startBtn.addEventListener('click',start);againBtn.addEventListener('click',start);restartBtn.addEventListener('click',reset);window.addEventListener('resize',resize);window.addEventListener('pageshow',e=>{if(e.persisted)location.reload()});resize();timeEl.textContent=fmt(TOTAL);
})();
</script>
</body>
</html>
