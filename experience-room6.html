<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate, max-age=0">
<meta http-equiv="Pragma" content="no-cache"><meta http-equiv="Expires" content="0">
<title>第6間體驗</title>
<style>
:root{color-scheme:dark;--bg:#06080b;--line:rgba(255,255,255,.1);--blue:#4a9eff}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--bg);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans TC",sans-serif;color:#f4f6f8}
button{font:inherit}.app{position:relative;width:100%;height:100%;display:grid;place-items:center;background:radial-gradient(circle at 50% 28%,#17202c 0,#090d12 42%,#040506 100%)}
.scene{position:absolute;inset:0;display:grid;place-items:center;opacity:0;pointer-events:none;transition:opacity 1s ease}.scene.on{opacity:1}.black{background:#030405}.corner{position:absolute;left:18px;top:16px;z-index:31;color:rgba(255,255,255,.34);font-size:.8rem;font-weight:800}.restart{position:absolute;right:16px;top:11px;z-index:31;border:1px solid rgba(255,255,255,.09);background:rgba(0,0,0,.25);color:rgba(255,255,255,.5);border-radius:11px;padding:7px 10px;cursor:pointer}.overlay{position:absolute;z-index:50;inset:0;background:radial-gradient(circle at 50% 36%,#1a2330,#090d12 58%,#040506);display:grid;place-items:center}.intro{text-align:center}.num{width:70px;height:70px;margin:auto;border-radius:23px;background:#edf3fa;color:#10151b;display:grid;place-items:center;font-size:2rem;font-weight:950}.intro h1{font-size:clamp(2.8rem,8vw,5.2rem);margin:24px 0 18px}.start{border:0;border-radius:17px;background:#edf3fa;color:#10151b;padding:16px 30px;font-weight:950;font-size:1.08rem;cursor:pointer}.end{display:none;position:absolute;z-index:45;inset:0;background:#030405;place-items:center;text-align:center}.end.show{display:grid}.end h2{font-size:clamp(3rem,9vw,6rem);margin:0}.again{margin-top:28px;border:1px solid #30343a;background:#101318;color:#eee;border-radius:14px;padding:12px 18px;cursor:pointer}
.phone-wrap{width:min(430px,92vw);height:min(830px,88vh);border-radius:42px;padding:10px;background:#0b0d10;box-shadow:0 34px 100px rgba(0,0,0,.58),inset 0 0 0 1px rgba(255,255,255,.08)}.phone{width:100%;height:100%;border-radius:34px;overflow:hidden;background:#f5f5f7;color:#18191b;display:flex;flex-direction:column;position:relative}.status{height:32px;display:flex;align-items:center;justify-content:space-between;padding:0 18px;font-size:.74rem;font-weight:750}.notch{position:absolute;top:8px;left:50%;transform:translateX(-50%);width:112px;height:24px;border-radius:16px;background:#0d0e10;z-index:3}.appbar{height:64px;display:flex;align-items:center;gap:12px;padding:8px 15px;border-bottom:1px solid #dedfe2;background:#fff}.avatar{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;color:#fff;font-size:.8rem;font-weight:850;background:linear-gradient(135deg,#5b8cff,#865ee8)}.appbar h3{margin:0;font-size:1rem}.appbar .sub{font-size:.72rem;color:#8c9299}.chat{flex:1;padding:16px 12px 24px;overflow:hidden;background:#eef0f3;display:flex;flex-direction:column;gap:8px}.bubble{max-width:79%;padding:10px 13px;border-radius:17px;font-size:.93rem;line-height:1.48;box-shadow:0 1px 0 rgba(0,0,0,.04);opacity:0;transform:translateY(8px);animation:pop .35s ease forwards}.me{align-self:flex-end;background:#84e66f;border-bottom-right-radius:5px}.other{align-self:flex-start;background:#fff;border-bottom-left-radius:5px}.read{align-self:flex-end;color:#8f969d;font-size:.69rem;margin-top:-4px;margin-right:5px;opacity:0;animation:fade .35s ease forwards}
.calendar{width:min(720px,91vw);background:#f7f7f8;color:#18191b;border-radius:30px;padding:clamp(22px,4vw,44px);box-shadow:0 30px 90px rgba(0,0,0,.5)}.cal-head{display:flex;justify-content:space-between;gap:20px}.cal-title{font-size:clamp(1.8rem,4vw,3.2rem);font-weight:900}.cal-time{font-size:clamp(3rem,8vw,6rem);font-weight:950;letter-spacing:-.06em;font-variant-numeric:tabular-nums}.event{margin-top:28px;border-left:5px solid var(--blue);background:#edf4ff;border-radius:14px;padding:18px 20px}.event strong{display:block;font-size:1.25rem}.event p{margin:6px 0 0;color:#646b73}.message-card{margin-top:24px;border-radius:18px;background:#fff;border:1px solid #e0e2e5;padding:17px 18px;box-shadow:0 8px 28px rgba(0,0,0,.07);opacity:0;transform:translateY(12px)}.message-card.show{animation:cardIn .55s ease forwards}.message-card .from{font-size:.76rem;color:#8f959b;font-weight:750}.message-card .msg{font-size:1.05rem;line-height:1.55;margin-top:7px}.message-card .reply{margin-top:12px;color:#666;font-size:.92rem;font-weight:700}
.work{width:min(920px,92vw);background:#f2f1ed;color:#1b1b1b;border-radius:28px;padding:clamp(24px,4vw,48px);box-shadow:0 28px 90px rgba(0,0,0,.46)}.work-top{display:flex;justify-content:space-between;align-items:center;gap:20px}.work h2{margin:0;font-size:clamp(1.8rem,4vw,3rem)}.badge{font-size:.78rem;background:#e4e2dc;border-radius:999px;padding:7px 11px;color:#666}.result{margin-top:28px;padding:26px;border-radius:18px;background:#fff;border:1px solid #dedbd4}.winner{font-size:.78rem;color:#9a948a;font-weight:800;letter-spacing:.08em}.winner-name{font-size:clamp(2rem,5vw,4.2rem);font-weight:950;margin-top:7px}.applause{margin-top:18px;color:#777}.your-work{margin-top:22px;padding-top:20px;border-top:1px solid #dedbd4}.your-work strong{display:block;font-size:1.08rem}.your-work .stamp{margin-top:8px;color:#8e8a83;font-size:.92rem}.social-card{width:min(760px,88vw);background:#fff;color:#1a1a1a;border-radius:24px;padding:22px;box-shadow:0 30px 80px rgba(0,0,0,.45)}.social-photo{height:min(410px,52vh);border-radius:18px;background:linear-gradient(135deg,#efb67d,#687fbd);display:grid;place-items:center;color:#fff;font-size:clamp(1.5rem,4vw,3rem);font-weight:900}.social-row{display:flex;justify-content:space-between;margin-top:18px;color:#666;font-weight:700}
@keyframes pop{to{opacity:1;transform:none}}@keyframes fade{to{opacity:1}}@keyframes cardIn{to{opacity:1;transform:none}}
@media(max-width:600px){.phone-wrap{height:92vh;border-radius:30px}.phone{border-radius:23px}.calendar,.work{border-radius:20px}.work-top{align-items:flex-start;flex-direction:column}}
</style>
</head>
<body>
<main class="app">
<div class="corner">第6間體驗</div><button class="restart" id="restart" type="button">重來</button>
<div class="scene" id="scene"></div>
<div class="end" id="end"><div><h2>結束</h2><button class="again" id="again" type="button">再播放一次</button></div></div>
<div class="overlay" id="intro"><div class="intro"><div class="num">6</div><h1>第6間體驗</h1><button class="start" id="start" type="button">開始</button></div></div>
</main>
<script>
(()=>{
const demo=new URLSearchParams(location.search).get('demo')==='1';
const scene=document.querySelector('#scene'),intro=document.querySelector('#intro'),end=document.querySelector('#end');
let timers=[];
function ms(n){return demo?Math.max(450,n*.22):n}
function later(fn,n){const id=setTimeout(fn,ms(n));timers.push(id);return id}
function clearTimers(){timers.forEach(clearTimeout);timers=[]}
function show(html){scene.className='scene';scene.innerHTML=html;requestAnimationFrame(()=>scene.classList.add('on'))}
function hide(next,n=1300){scene.classList.remove('on');later(()=>{scene.innerHTML='';next?.()},n)}
function bubble(text,type='other',delay=0,read=false){later(()=>{const chat=document.querySelector('#chat');if(!chat)return;const b=document.createElement('div');b.className=`bubble ${type}`;b.textContent=text;chat.appendChild(b);if(read){const r=document.createElement('div');r.className='read';r.textContent='已讀 7';chat.appendChild(r)}},delay)}
function phoneShell(){return `<div class="phone-wrap"><div class="phone"><div class="notch"></div><div class="status"><span>18:42</span><span>5G　78%</span></div><div class="appbar"><div class="avatar">群</div><div><h3>朋友們</h3><div class="sub">8 位成員</div></div></div><div class="chat" id="chat"></div></div></div>`}
function black(next,n=3200){show('<div class="black"></div>');later(()=>hide(next,600),n)}
function groupChat(){show(phoneShell());bubble('今天晚上有人要一起吃飯嗎？','me',500,true);bubble('晚上火鍋？','other',6500);bubble('+1','other',7300);bubble('我可以！','other',8000);bubble('哪一家？','other',8800);bubble('哈哈哈哈走啊','other',9600);later(()=>hide(()=>black(lunch)),15000)}
function lunch(){show(`<div class="calendar"><div class="cal-head"><div><div class="cal-title">一起吃午餐</div></div><div class="cal-time" id="clock">12:42</div></div><div class="event"><strong>13:00 · 約好的午餐</strong><p>你提早到了。</p></div><div class="message-card" id="cancel"><div class="from">朋友 · 剛剛</div><div class="msg">抱歉，我今天臨時有事，可能沒辦法去了。<br>改天好嗎？</div><div class="reply">你的回覆：沒關係～</div></div></div>`);[['12:48',3500],['12:55',7500],['13:04',11500],['13:17',16000]].forEach(([t,d])=>later(()=>{const c=document.querySelector('#clock');if(c)c.textContent=t},d));later(()=>document.querySelector('#cancel')?.classList.add('show'),21000);later(()=>hide(()=>black(work)),30000)}
function work(){show(`<div class="work"><div class="work-top"><h2>成果公布</h2><div class="badge">今天 15:30</div></div><div class="result"><div class="winner">BEST PROJECT</div><div class="winner-name">最佳作品：陳同學</div><div class="applause">大家鼓掌。老師說：「這次大家都做得不錯。」</div><div class="your-work"><strong>你的作品</strong><div class="stamp">完成時間：昨天 02:14</div></div></div></div>`);later(()=>hide(()=>black(afterParty)),24000)}
function afterParty(){show(`<div class="social-card"><div class="social-photo">今天超開心 ❤️</div><div class="social-row"><span>朋友們</span><span>剛剛</span></div></div>`);later(()=>hide(()=>black(finish,4200)),12000)}
function finish(){end.classList.add('show')}
function start(){clearTimers();intro.style.display='none';end.classList.remove('show');scene.className='scene';scene.innerHTML='';document.documentElement.requestFullscreen?.().catch?.(()=>{});black(groupChat,1800)}
function reset(){clearTimers();scene.className='scene';scene.innerHTML='';end.classList.remove('show');intro.style.display='grid'}
document.querySelector('#start').addEventListener('click',start);document.querySelector('#restart').addEventListener('click',reset);document.querySelector('#again').addEventListener('click',start);
})();
</script>
</body>
</html>
