<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate, max-age=0">
<meta http-equiv="Pragma" content="no-cache"><meta http-equiv="Expires" content="0">
<title>第6間體驗</title>
<style>
:root{color-scheme:dark;--bg:#06080b;--panel:#11161c;--line:rgba(255,255,255,.10);--text:#f4f6f8;--muted:#8f99a5;--blue:#4a9eff;--green:#63d38b;--red:#ff7f7a}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--bg);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans TC",sans-serif;color:var(--text)}
button{font:inherit}.app{position:relative;width:100%;height:100%;display:grid;place-items:center;background:radial-gradient(circle at 50% 28%,#17202c 0,#090d12 42%,#040506 100%)}
.scene{position:absolute;inset:0;display:grid;place-items:center;opacity:0;pointer-events:none;transition:opacity 1.1s ease}.scene.on{opacity:1;pointer-events:auto}.black{background:#030405}.caption{max-width:900px;padding:32px;text-align:center;font-size:clamp(1.7rem,5vw,4rem);font-weight:850;line-height:1.45;letter-spacing:-.035em}.caption small{display:block;margin-top:18px;font-size:clamp(.9rem,1.6vw,1.05rem);font-weight:600;color:#737c86;letter-spacing:0}
.phone-wrap{width:min(430px,92vw);height:min(830px,88vh);border-radius:42px;padding:10px;background:#0b0d10;box-shadow:0 34px 100px rgba(0,0,0,.58),inset 0 0 0 1px rgba(255,255,255,.08)}.phone{width:100%;height:100%;border-radius:34px;overflow:hidden;background:#f5f5f7;color:#18191b;display:flex;flex-direction:column;position:relative}.status{height:32px;display:flex;align-items:center;justify-content:space-between;padding:0 18px;font-size:.74rem;font-weight:750;background:#f5f5f7}.notch{position:absolute;top:8px;left:50%;transform:translateX(-50%);width:112px;height:24px;border-radius:16px;background:#0d0e10;z-index:3}.appbar{height:64px;display:flex;align-items:center;gap:12px;padding:8px 15px;border-bottom:1px solid #dedfe2;background:#fff}.avatar{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;color:white;font-size:.8rem;font-weight:850;background:linear-gradient(135deg,#5b8cff,#865ee8)}.appbar h3{margin:0;font-size:1rem}.appbar .sub{font-size:.72rem;color:#8c9299;margin-top:2px}.chat{flex:1;padding:16px 12px 24px;overflow:hidden;background:#eef0f3;display:flex;flex-direction:column;gap:8px}.bubble{max-width:79%;padding:10px 13px;border-radius:17px;font-size:.93rem;line-height:1.48;box-shadow:0 1px 0 rgba(0,0,0,.04);opacity:0;transform:translateY(8px);animation:pop .35s ease forwards}.me{align-self:flex-end;background:#84e66f;border-bottom-right-radius:5px}.other{align-self:flex-start;background:#fff;border-bottom-left-radius:5px}.sys{align-self:center;background:transparent;color:#8a929b;box-shadow:none;font-size:.72rem;padding:4px}.read{align-self:flex-end;color:#8f969d;font-size:.69rem;margin-top:-4px;margin-right:5px;opacity:0;animation:fade .35s ease forwards}.typing{align-self:flex-start;background:white;border-radius:17px;padding:11px 14px;color:#9aa0a6;display:none}.typing.show{display:block}.dots span{display:inline-block;width:6px;height:6px;border-radius:50%;background:#a9afb5;margin:0 2px;animation:dot 1s infinite}.dots span:nth-child(2){animation-delay:.16s}.dots span:nth-child(3){animation-delay:.32s}
.calendar{width:min(720px,91vw);background:#f7f7f8;color:#18191b;border-radius:30px;padding:clamp(22px,4vw,44px);box-shadow:0 30px 90px rgba(0,0,0,.5)}.cal-head{display:flex;justify-content:space-between;align-items:flex-start;gap:20px}.cal-kicker{font-size:.8rem;color:#91969d;font-weight:750;letter-spacing:.08em}.cal-title{font-size:clamp(1.8rem,4vw,3.2rem);font-weight:900;margin:8px 0 4px}.cal-time{font-size:clamp(3rem,8vw,6rem);font-weight:950;letter-spacing:-.065em;font-variant-numeric:tabular-nums}.event{margin-top:28px;border-left:5px solid var(--blue);background:#edf4ff;border-radius:14px;padding:18px 18px 18px 20px}.event strong{display:block;font-size:1.25rem}.event p{margin:6px 0 0;color:#646b73}.wait-note{margin-top:20px;color:#7f858c;font-size:.9rem}.message-card{margin-top:24px;border-radius:18px;background:#fff;border:1px solid #e0e2e5;padding:17px 18px;box-shadow:0 8px 28px rgba(0,0,0,.07);opacity:0;transform:translateY(12px)}.message-card.show{animation:cardIn .55s ease forwards}.message-card .from{font-size:.76rem;color:#8f959b;font-weight:750}.message-card .msg{font-size:1.05rem;line-height:1.55;margin-top:7px}.message-card .reply{margin-top:12px;color:#7f858c;font-size:.9rem}.reply-ok{color:#666;font-weight:700}
.work{width:min(920px,92vw);background:#f2f1ed;color:#1b1b1b;border-radius:28px;padding:clamp(24px,4vw,48px);box-shadow:0 28px 90px rgba(0,0,0,.46)}.work-top{display:flex;justify-content:space-between;align-items:center;gap:20px}.work h2{margin:0;font-size:clamp(1.8rem,4vw,3rem)}.badge{font-size:.78rem;background:#e4e2dc;border-radius:999px;padding:7px 11px;color:#666}.result{margin-top:28px;padding:26px;border-radius:18px;background:#fff;border:1px solid #dedbd4}.winner{font-size:.78rem;color:#9a948a;font-weight:800;letter-spacing:.08em}.winner-name{font-size:clamp(2rem,5vw,4.2rem);font-weight:950;margin-top:7px}.applause{margin-top:18px;color:#777}.your-work{margin-top:22px;padding-top:20px;border-top:1px solid #dedbd4}.your-work strong{display:block;font-size:1.08rem}.your-work .stamp{margin-top:8px;color:#8e8a83;font-size:.92rem}.clock-note{margin-top:16px;font-size:1.05rem;color:#555}.clock-note b{font-size:1.35rem;color:#222}
.story{position:absolute;inset:0;display:grid;place-items:center;background:#05070a}.story-card{width:min(980px,92vw);padding:36px;text-align:center}.story-card .eyebrow{font-size:.8rem;letter-spacing:.16em;color:#717b86;font-weight:800}.story-card h2{font-size:clamp(2.2rem,6vw,5rem);margin:15px 0 12px;letter-spacing:-.05em}.story-card p{color:#8c96a2;font-size:clamp(1rem,2vw,1.2rem);line-height:1.8}.progress{position:absolute;left:0;right:0;bottom:0;height:3px;background:rgba(255,255,255,.04);z-index:30}.progress i{display:block;height:100%;width:0;background:rgba(255,255,255,.32)}.corner{position:absolute;left:18px;top:16px;z-index:31;color:rgba(255,255,255,.34);font-size:.8rem;font-weight:800}.restart{position:absolute;right:16px;top:11px;z-index:31;border:1px solid rgba(255,255,255,.09);background:rgba(0,0,0,.25);color:rgba(255,255,255,.5);border-radius:11px;padding:7px 10px;cursor:pointer}.overlay{position:absolute;z-index:50;inset:0;background:radial-gradient(circle at 50% 36%,#1a2330,#090d12 58%,#040506);display:grid;place-items:center;padding:24px}.intro{text-align:center;width:min(680px,92vw)}.num{width:70px;height:70px;margin:auto;border-radius:23px;background:#edf3fa;color:#10151b;display:grid;place-items:center;font-size:2rem;font-weight:950}.intro h1{font-size:clamp(2.8rem,8vw,5.4rem);margin:24px 0 13px;letter-spacing:-.055em}.intro p{color:#9ca7b3;line-height:1.85;font-size:1.05rem}.start{margin-top:30px;border:0;border-radius:17px;background:#edf3fa;color:#10151b;padding:16px 30px;font-weight:950;font-size:1.08rem;cursor:pointer}.end{display:none;position:absolute;z-index:45;inset:0;background:#030405;place-items:center;text-align:center}.end.show{display:grid}.end h2{font-size:clamp(2.5rem,7vw,5.5rem);margin:0;line-height:1.25;letter-spacing:-.05em}.end p{margin:20px auto 0;color:#6e7680;max-width:620px;line-height:1.8}.again{margin-top:28px;border:1px solid #30343a;background:#101318;color:#eee;border-radius:14px;padding:12px 18px;cursor:pointer}
@keyframes pop{to{opacity:1;transform:none}}@keyframes fade{to{opacity:1}}@keyframes dot{0%,60%,100%{opacity:.35;transform:translateY(0)}30%{opacity:1;transform:translateY(-3px)}}@keyframes cardIn{to{opacity:1;transform:none}}
@media(max-width:600px){.phone-wrap{height:92vh;border-radius:30px}.phone{border-radius:23px}.calendar,.work{border-radius:20px}.caption{padding:20px}.work-top{align-items:flex-start;flex-direction:column}}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation-duration:.01ms!important}}
</style>
</head>
<body>
<main class="app">
<div class="corner">第6間體驗</div><button class="restart" id="restart" type="button">重來</button>
<div class="progress"><i id="progress"></i></div>
<div class="scene" id="scene"></div>
<div class="end" id="end"><div><h2>你剛剛失去的，<br>真的是那件事情嗎？</h2><p>還是你原本期待的是：被記得、被重視、被看見，或有人願意陪你？</p><button class="again" id="again" type="button">再播放一次</button></div></div>
<div class="overlay" id="intro"><div class="intro"><div class="num">6</div><h1>第6間體驗</h1><p>接下來只要看著畫面。<br>不用替畫面中的人找答案，也不用急著判斷自己應該有什麼感覺。</p><button class="start" id="start" type="button">開始播放</button></div></div>
</main>
<script>
(()=>{
const demo=new URLSearchParams(location.search).get('demo')==='1';
const scene=document.querySelector('#scene'),intro=document.querySelector('#intro'),end=document.querySelector('#end'),progress=document.querySelector('#progress');
let timers=[],startedAt=0,total=demo?83000:360000,running=false,audio=null;
function later(fn,ms){const id=setTimeout(fn,demo?Math.max(500,ms*.23):ms);timers.push(id);return id}
function clearTimers(){timers.forEach(clearTimeout);timers=[]}
function ensureAudio(){if(audio)return;const AC=window.AudioContext||window.webkitAudioContext;if(AC)audio=new AC()}
function tone(freq=520,d=.06,v=.018){if(!audio)return;const o=audio.createOscillator(),g=audio.createGain();o.type='sine';o.frequency.value=freq;g.gain.value=v;o.connect(g);g.connect(audio.destination);o.start();g.gain.exponentialRampToValueAtTime(.0001,audio.currentTime+d);o.stop(audio.currentTime+d+.01)}
function buzz(){if(!audio)return;const o=audio.createOscillator(),g=audio.createGain();o.type='sine';o.frequency.value=165;g.gain.value=.025;o.connect(g);g.connect(audio.destination);o.start();g.gain.exponentialRampToValueAtTime(.0001,audio.currentTime+.14);o.stop(audio.currentTime+.15)}
function show(html,cls=''){scene.className='scene';scene.innerHTML=html;requestAnimationFrame(()=>scene.classList.add('on'));if(cls)scene.classList.add(cls)}
function hide(cb,wait=1100){scene.classList.remove('on');later(()=>{scene.innerHTML='';cb?.()},wait)}
function bubble(text,type='other',delay=0,extra=''){later(()=>{const chat=document.querySelector('#chat');if(!chat)return;const b=document.createElement('div');b.className=`bubble ${type}`;b.innerHTML=text;chat.appendChild(b);tone(type==='me'?620:470,.045,.012);if(extra){const x=document.createElement('div');x.className=extra==='read'?'read':'sys';x.textContent=extra==='read'?'已讀 7':extra;chat.appendChild(x)}},delay)}
function phoneShell(title='朋友們',sub='8 位成員'){return `<div class="phone-wrap"><div class="phone"><div class="notch"></div><div class="status"><span>18:42</span><span>5G　78%</span></div><div class="appbar"><div class="avatar">群</div><div><h3>${title}</h3><div class="sub">${sub}</div></div></div><div class="chat" id="chat"></div></div></div>`}
function introCard(kicker,title,copy){show(`<div class="story"><div class="story-card"><div class="eyebrow">${kicker}</div><h2>${title}</h2><p>${copy}</p></div></div>`)}

function part1(){
 introCard('第一段','只是想找人一起吃飯','你傳了一句很普通的訊息。');
 later(()=>{hide(()=>{show(phoneShell());bubble('今天晚上有人要一起吃飯嗎？','me',400,'read');bubble('晚上火鍋？','other',6200);bubble('+1','other',7000);bubble('我可以！','other',7600);bubble('哪一家？','other',8250);bubble('哈哈哈哈走啊','other',9000);later(()=>buzz(),6200);later(()=>hide(part1b),14500)})},4200)
}
function part1b(){
 show(`<div class="black"><div class="caption">你的那一句，<br>還留在上面。<small>沒有人回。</small></div></div>`);
 later(()=>hide(part2),7000)
}
function part2(){
 introCard('第二段','你其實有期待','因為對方是先約你的。');
 later(()=>{hide(()=>{
  show(`<div class="calendar"><div class="cal-head"><div><div class="cal-kicker">TODAY</div><div class="cal-title">一起吃午餐</div></div><div class="cal-time" id="clock">12:42</div></div><div class="event"><strong>13:00 · 約好的午餐</strong><p>你提早到了。</p></div><div class="wait-note" id="waitNote">還有 18 分鐘。</div><div class="message-card" id="cancel"><div class="from">朋友 · 剛剛</div><div class="msg">抱歉，我今天臨時有事，可能沒辦法去了。<br>改天好嗎？</div><div class="reply">你的回覆：<span class="reply-ok">沒關係～</span></div></div></div>`);
  const times=[['12:48','還有 12 分鐘。'],['12:55','還有 5 分鐘。'],['13:04','已經過 4 分鐘。'],['13:17','已經過 17 分鐘。']];
  times.forEach((x,i)=>later(()=>{const c=document.querySelector('#clock'),n=document.querySelector('#waitNote');if(c)c.textContent=x[0];if(n)n.textContent=x[1]},3500+i*4200));
  later(()=>{document.querySelector('#cancel')?.classList.add('show');buzz()},21000);
  later(()=>hide(part2b),30000)
 })},4000)
}
function part2b(){show(`<div class="black"><div class="caption">「沒關係～」<small>可是你原本是真的很期待。</small></div></div>`);later(()=>hide(part3),7500)}
function part3(){
 introCard('第三段','努力不一定會被看見','你只是比平常更認真了一點。');
 later(()=>{hide(()=>{
  show(`<div class="work"><div class="work-top"><h2>成果公布</h2><div class="badge">今天 15:30</div></div><div class="result"><div class="winner">BEST PROJECT</div><div class="winner-name">最佳作品：陳同學</div><div class="applause">大家鼓掌。老師說：「這次大家都做得不錯。」</div><div class="your-work"><strong>你的作品</strong><div class="stamp">完成時間：昨天 02:14</div><div class="clock-note">你昨天為了它做到 <b>02:14</b>。</div></div></div></div>`);
  tone(360,.08,.012);later(()=>hide(part3b),24000)
 })},4200)
}
function part3b(){show(`<div class="black"><div class="caption">沒有人說你做得不好。<br>只是沒有發生你期待的結果。</div></div>`);later(()=>hide(part4),8500)}
function part4(){
 introCard('最後','有些失落不是「失去」','而是你以為自己會被留下。');
 later(()=>{hide(()=>{
  show(phoneShell('朋友們','8 位成員'));
  bubble('今晚真的超好笑 😂','other',1100);bubble('下次還要再約','other',1900);bubble('照片傳一下！','other',2600);
  later(()=>{const chat=document.querySelector('#chat');if(!chat)return;const card=document.createElement('div');card.className='bubble other';card.style.maxWidth='92%';card.innerHTML='<div style="width:250px;height:160px;border-radius:12px;background:linear-gradient(135deg,#e9a36d,#6e82bc);display:grid;place-items:center;color:white;font-size:1.2rem;font-weight:900">今天超開心 ❤️</div>';chat.appendChild(card);buzz()},3600);
  later(()=>hide(finalQuestion),11500)
 })},4000)
}
function finalQuestion(){show(`<div class="black"><div class="caption">你剛剛失去的，<br>是什麼？<small>不用現在回答。</small></div></div>`);later(()=>hide(finish),12000)}
function finish(){running=false;end.classList.add('show')}
function tick(){if(!running)return;const elapsed=performance.now()-startedAt;progress.style.width=`${Math.min(100,elapsed/total*100)}%`;requestAnimationFrame(tick)}
function start(){clearTimers();ensureAudio();audio?.resume?.();intro.style.display='none';end.classList.remove('show');scene.className='scene';scene.innerHTML='';progress.style.width='0';running=true;startedAt=performance.now();document.documentElement.requestFullscreen?.().catch?.(()=>{});part1();tick()}
function reset(){clearTimers();running=false;scene.className='scene';scene.innerHTML='';end.classList.remove('show');progress.style.width='0';intro.style.display='grid'}
document.querySelector('#start').addEventListener('click',start);document.querySelector('#restart').addEventListener('click',reset);document.querySelector('#again').addEventListener('click',start);
})();
</script>
</body>
</html>
