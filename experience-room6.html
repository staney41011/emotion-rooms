<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate, max-age=0">
<meta http-equiv="Pragma" content="no-cache"><meta http-equiv="Expires" content="0">
<title>第6間體驗</title>
<style>
:root{color-scheme:dark;--bg:#05070a;--ink:#f3f5f7;--muted:#8b949e;--line:rgba(255,255,255,.09);--phone:#11151a}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--bg);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans TC",sans-serif;color:var(--ink)}
button{font:inherit}.app{position:relative;width:100%;height:100%;overflow:hidden;background:#05070a}.scene{position:absolute;inset:0;opacity:0;transition:opacity 1.25s ease;pointer-events:none}.scene.on{opacity:1}.black{background:#030405}.overlay{position:absolute;z-index:50;inset:0;display:grid;place-items:center;background:radial-gradient(circle at 50% 36%,#18202a,#090c10 58%,#040506);padding:24px}.intro{text-align:center}.num{width:72px;height:72px;border-radius:23px;background:#eef2f6;color:#12171c;display:grid;place-items:center;margin:auto;font-size:2rem;font-weight:950}.intro h1{font-size:clamp(2.8rem,8vw,5.5rem);margin:24px 0 0;letter-spacing:-.055em}.start{margin-top:34px;border:0;border-radius:17px;background:#eef2f6;color:#12171c;padding:16px 31px;font-weight:950;font-size:1.08rem;cursor:pointer}.end{display:none;position:absolute;z-index:45;inset:0;background:#030405;place-items:center;text-align:center}.end.show{display:grid}.end h2{font-size:clamp(3rem,9vw,6rem);margin:0;letter-spacing:-.055em}.again{margin-top:30px;border:1px solid #2b3036;background:#101318;color:#eee;border-radius:14px;padding:12px 18px;cursor:pointer}

/* phone */
.phone-shell{position:absolute;inset:0;display:grid;place-items:center;background:radial-gradient(circle at 50% 25%,#17202a,#080b0f 48%,#040506)}.phone{width:min(430px,92vw);height:min(830px,90vh);border-radius:40px;background:#0d1014;padding:10px;box-shadow:0 35px 100px rgba(0,0,0,.58),inset 0 0 0 1px rgba(255,255,255,.09)}.screen{height:100%;border-radius:31px;overflow:hidden;background:#eef0f3;color:#17191b;position:relative;display:flex;flex-direction:column}.notch{position:absolute;z-index:4;top:8px;left:50%;transform:translateX(-50%);width:112px;height:24px;background:#0b0c0e;border-radius:16px}.status{height:33px;display:flex;align-items:center;justify-content:space-between;padding:0 18px;font-size:.72rem;font-weight:800;background:#f6f6f7}.appbar{height:62px;display:flex;align-items:center;gap:11px;background:#fff;border-bottom:1px solid #dedfe2;padding:8px 14px}.avatar{width:39px;height:39px;border-radius:50%;display:grid;place-items:center;color:white;font-size:.78rem;font-weight:900;background:linear-gradient(135deg,#588cf7,#8661de)}.appbar strong{font-size:.98rem}.appbar small{display:block;color:#8b9299;margin-top:2px}.chat{flex:1;padding:16px 12px 30px;overflow:hidden;display:flex;flex-direction:column;gap:8px;background:#edf0f3}.bubble{max-width:79%;padding:10px 13px;border-radius:17px;font-size:.94rem;line-height:1.45;opacity:0;transform:translateY(8px);animation:pop .38s ease forwards}.me{align-self:flex-end;background:#88e875;border-bottom-right-radius:5px}.other{align-self:flex-start;background:white;border-bottom-left-radius:5px}.read{align-self:flex-end;color:#8d949b;font-size:.69rem;margin-top:-4px;margin-right:5px;opacity:0;animation:fade .4s ease forwards}.typing{align-self:flex-start;background:white;border-radius:17px;padding:11px 14px;color:#979da4}.dots span{display:inline-block;width:6px;height:6px;border-radius:50%;background:#a8afb6;margin:0 2px;animation:dot 1s infinite}.dots span:nth-child(2){animation-delay:.15s}.dots span:nth-child(3){animation-delay:.3s}

/* group photo */
.photo-scene{position:absolute;inset:0;background:linear-gradient(180deg,#cab59f,#a98f78 47%,#765f50);overflow:hidden}.lights{position:absolute;inset:0;background:radial-gradient(circle at 50% 12%,rgba(255,245,220,.28),transparent 28%)}.people{position:absolute;left:50%;bottom:88px;transform:translateX(-50%);display:flex;gap:18px;align-items:flex-end}.person{width:78px;height:196px;position:relative}.head{position:absolute;width:54px;height:54px;border-radius:50%;background:#edc9ad;top:0;left:50%;transform:translateX(-50%)}.body{position:absolute;left:0;bottom:0;width:78px;height:132px;border-radius:30px 30px 16px 16px}.flash{position:absolute;inset:0;background:white;opacity:0}.flash.go{animation:flash 1s ease}.photo-card-wrap{position:absolute;inset:0;display:none;place-items:center;background:#e8e2da}.photo-card{width:min(780px,88vw);background:#fff;padding:22px 22px 74px;box-shadow:0 20px 50px rgba(0,0,0,.18);transform:rotate(-1deg)}.photo-inner{height:min(430px,55vh);background:linear-gradient(180deg,#c7b19b,#9d826d 50%,#705949);position:relative;overflow:hidden}.photo-inner .people{bottom:46px;gap:14px}.story-strip{position:absolute;bottom:20px;left:50%;transform:translateX(-50%);font-size:1rem;color:#fff;font-weight:800;text-shadow:0 2px 8px rgba(0,0,0,.45)}

/* cafe */
.cafe{position:absolute;inset:0;background:linear-gradient(180deg,#4c4037,#2b241f 34%,#171412 68%,#11100f)}.window{position:absolute;top:55px;left:50%;transform:translateX(-50%);width:min(820px,78vw);height:min(280px,30vh);border:12px solid #30271f;background:linear-gradient(180deg,#cfe3f3,#a9c8df 48%,#758d9f);transition:filter 4s ease}.window.evening{filter:brightness(.48) saturate(.75)}.clock{position:absolute;top:24px;right:28px;color:#f1e8de;font-size:2rem;font-weight:950;font-variant-numeric:tabular-nums}.table{position:absolute;left:50%;bottom:98px;transform:translateX(-50%);width:min(880px,88vw);height:185px;border-radius:18px;background:linear-gradient(180deg,#76543e,#50392b);box-shadow:0 20px 45px rgba(0,0,0,.25)}.cup{position:absolute;bottom:34px;width:112px;height:130px;background:#eee7df;border-radius:0 0 25px 25px;box-shadow:0 10px 20px rgba(0,0,0,.18)}.cup:before{content:"";position:absolute;left:0;top:-9px;width:112px;height:20px;border-radius:50%;background:#f9f4ee}.cup:after{content:"";position:absolute;right:-23px;top:30px;width:25px;height:44px;border:8px solid #ddd4cc;border-left:0;border-radius:0 20px 20px 0}.cup.a{left:18%}.cup.b{right:18%}.coffee{position:absolute;left:10px;right:10px;top:17px;height:79px;border-radius:0 0 22px 22px;background:#8a5b39}.cafe-phone{position:absolute;left:50%;bottom:28px;transform:translateX(-50%);width:min(340px,74vw);background:#fafafa;color:#18191a;border-radius:18px;padding:13px 15px;box-shadow:0 12px 35px rgba(0,0,0,.22);opacity:0}.cafe-phone.show{animation:cardIn .55s ease forwards}.cafe-phone small{display:block;color:#93989e;font-weight:800;margin-bottom:6px}.cafe-phone div{line-height:1.45}

/* work */
.work-scene{position:absolute;inset:0;background:linear-gradient(180deg,#e9eef3 0 16%,#d5dce4 16% 18%,#c8d0d8 18%)}.desk{position:absolute;left:50%;top:54%;transform:translate(-50%,-50%);width:min(1060px,91vw);height:min(550px,65vh);border-radius:26px;background:#d6ae81;box-shadow:0 24px 50px rgba(0,0,0,.17)}.paper{position:absolute;background:white;border-radius:8px;box-shadow:0 8px 20px rgba(0,0,0,.09)}.paper .band{position:absolute;top:0;left:0;right:0;height:17px}.mine{left:38%;top:23%;width:28%;height:43%}.mine .band{background:#6faeea}.winner{right:6%;top:18%;width:24%;height:38%}.winner .band{background:#8ac36b}.other-paper{left:6%;top:18%;width:24%;height:35%}.other-paper .band{background:#e39472}.sticky{position:absolute;width:56px;height:56px;background:#fff0a9;box-shadow:0 7px 14px rgba(0,0,0,.08);transform:rotate(-6deg)}.sticky.one{left:34%;bottom:17%}.sticky.two{left:68%;bottom:18%;transform:rotate(5deg)}.time-note{position:absolute;bottom:18px;left:20px;color:#858585;font-size:1.15rem;font-weight:900}.spot{position:absolute;inset:-10px;border:6px solid rgba(76,144,255,.68);border-radius:14px;opacity:0}.spot.show{animation:fade .6s forwards}.applause-text{position:absolute;right:7%;bottom:26%;font-size:1.15rem;color:#5d6368;opacity:0}.applause-text.show{animation:fade .7s forwards}

/* gift */
.gift-scene{position:absolute;inset:0;background:linear-gradient(180deg,#423744,#221c25 44%,#121013)}.party{position:absolute;top:55px;left:50%;transform:translateX(-50%);width:min(920px,90vw);height:310px;border-radius:24px;background:radial-gradient(circle at 50% 12%,rgba(255,231,180,.24),transparent 28%),linear-gradient(180deg,#5c4a5e,#302636);overflow:hidden}.party-people{position:absolute;left:50%;bottom:20px;transform:translateX(-50%) scale(.72);display:flex;gap:16px}.party-away{transition:transform 5s ease,opacity 5s ease}.party-away.leave{transform:translateX(240px) scale(.72);opacity:.18}.bag{position:absolute;left:50%;bottom:60px;transform:translateX(-50%);width:min(350px,48vw);height:min(380px,44vh);border-radius:22px 22px 30px 30px;background:#3a2f27;box-shadow:0 24px 46px rgba(0,0,0,.32)}.bag:before{content:"";position:absolute;left:50%;top:-58px;transform:translateX(-50%);width:180px;height:90px;border:12px solid #7e6957;border-bottom:0;border-radius:90px 90px 0 0}.gift{position:absolute;left:50%;top:47%;transform:translate(-50%,-50%);width:190px;height:150px;border-radius:12px;background:#eee3d8;box-shadow:0 14px 28px rgba(0,0,0,.2);transition:transform 4s ease,top 4s ease}.gift.out{top:13%;transform:translate(-50%,-50%) scale(1.05)}.gift.back{top:55%;transform:translate(-50%,-50%) scale(.92)}.gift:before{content:"";position:absolute;left:50%;top:0;transform:translateX(-50%);width:27px;height:100%;background:#c9527a}.gift:after{content:"";position:absolute;left:0;right:0;top:50%;transform:translateY(-50%);height:22px;background:#c9527a}

/* empty seat */
.auditorium{position:absolute;inset:0;background:radial-gradient(circle at 50% 0,rgba(255,239,198,.17),transparent 23%),linear-gradient(180deg,#3a3947,#211f29 34%,#131217)}.stage-light{position:absolute;left:50%;top:0;transform:translateX(-50%);width:430px;height:430px;background:radial-gradient(circle at 50% 0,rgba(255,244,210,.4),transparent 68%)}.rows{position:absolute;left:50%;bottom:80px;transform:translateX(-50%)}.row{display:flex;gap:18px;margin-top:18px}.seat{width:86px;height:76px;border-radius:14px 14px 10px 10px;background:#46424e;position:relative}.seat:before{content:"";position:absolute;top:-25px;left:0;width:86px;height:27px;border-radius:12px 12px 0 0;background:#57525e}.seat.reserved{background:#706a78;box-shadow:0 0 0 3px rgba(255,255,255,.16) inset}.door{position:absolute;right:7%;top:24%;width:76px;height:190px;background:#18171d;border:3px solid rgba(255,255,255,.08)}.door:after{content:"";position:absolute;inset:0;background:#e7d7b9;opacity:0;transition:opacity .7s}.door.open:after{opacity:.8}

/* birthday */
.lock-scene{position:absolute;inset:0;display:grid;place-items:center;background:linear-gradient(180deg,#141923,#080b10 58%,#040506)}.lock-phone{width:min(430px,92vw);height:min(820px,90vh);border-radius:40px;padding:10px;background:#0c0e11;box-shadow:0 30px 95px rgba(0,0,0,.55)}.lock-screen{height:100%;border-radius:31px;position:relative;overflow:hidden;background:radial-gradient(circle at 50% 20%,#43536a,#202a39 44%,#10151d);color:white}.lock-time{padding-top:105px;text-align:center;font-size:clamp(4rem,14vw,6.4rem);font-weight:250;letter-spacing:-.06em}.lock-date{text-align:center;font-size:1.1rem;color:#e5e8eb}.notifications{position:absolute;left:16px;right:16px;bottom:65px;display:flex;flex-direction:column;gap:10px}.notif{background:rgba(242,244,247,.88);backdrop-filter:blur(16px);color:#202329;border-radius:18px;padding:12px 14px;opacity:0;transform:translateY(10px)}.notif.show{animation:cardIn .5s ease forwards}.notif small{display:block;color:#777f87;font-weight:800;margin-bottom:4px}.notif div{font-size:.9rem}

/* leftover */
.snack{position:absolute;inset:0;background:linear-gradient(180deg,#efe8df,#d8cfc3 28%,#c9bcaa)}.snack-table{position:absolute;left:50%;top:56%;transform:translate(-50%,-50%);width:min(980px,90vw);height:min(430px,55vh);border-radius:24px;background:#f7f1e9;box-shadow:0 18px 42px rgba(0,0,0,.14)}.plate{position:absolute;top:145px;width:135px;height:135px;border-radius:50%;background:white;box-shadow:0 8px 18px rgba(0,0,0,.12)}.plate.a{left:17%}.plate.b{right:17%}.bread{position:absolute;left:39px;top:50px;width:58px;height:33px;border-radius:50px;background:#d4a068}.hand{position:absolute;right:17%;bottom:50px;width:175px;height:48px;border-radius:25px;background:#efc6aa;transform:rotate(-14deg);opacity:0}.hand.show{animation:takeBack 5.5s ease forwards}

@keyframes pop{to{opacity:1;transform:none}}@keyframes fade{to{opacity:1}}@keyframes dot{0%,60%,100%{opacity:.3;transform:translateY(0)}30%{opacity:1;transform:translateY(-3px)}}@keyframes flash{0%{opacity:0}14%{opacity:1}100%{opacity:0}}@keyframes cardIn{to{opacity:1;transform:none}}@keyframes takeBack{0%{opacity:0;transform:rotate(-14deg) translateY(18px)}18%{opacity:1}70%{opacity:1;transform:rotate(-14deg) translate(-125px,-88px)}100%{opacity:0;transform:rotate(-14deg) translate(-80px,-18px)}}
@media(max-width:650px){.phone,.lock-phone{height:92vh;border-radius:30px}.screen,.lock-screen{border-radius:22px}.people{gap:8px;transform:translateX(-50%) scale(.78)}.row{gap:9px}.seat,.seat:before{width:58px}.seat{height:58px}.cup.a{left:10%}.cup.b{right:10%}}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation-duration:.01ms!important}}
</style>
</head>
<body>
<main class="app">
  <section class="scene black" id="scene"></section>
  <div class="overlay" id="intro"><div class="intro"><div class="num">6</div><h1>第6間體驗</h1><button class="start" id="start" type="button">開始</button></div></div>
  <div class="end" id="end"><div><h2>結束</h2><button class="again" id="again" type="button">再播放一次</button></div></div>
</main>
<script>
(()=>{
const demo=new URLSearchParams(location.search).get('demo')==='1';
const scene=document.querySelector('#scene'),intro=document.querySelector('#intro'),end=document.querySelector('#end');
let timers=[],audio=null,runId=0;
const scale=ms=>demo?Math.max(500,ms*.16):ms;
function later(fn,ms){const id=setTimeout(fn,scale(ms));timers.push(id);return id}
function wait(ms){return new Promise(resolve=>later(resolve,ms))}
function clearTimers(){timers.forEach(clearTimeout);timers=[]}
function ensureAudio(){if(audio)return;const AC=window.AudioContext||window.webkitAudioContext;if(AC)audio=new AC()}
function tone(freq=520,d=.07,v=.016){if(!audio)return;const o=audio.createOscillator(),g=audio.createGain();o.type='sine';o.frequency.value=freq;g.gain.value=v;o.connect(g);g.connect(audio.destination);o.start();g.gain.exponentialRampToValueAtTime(.0001,audio.currentTime+d);o.stop(audio.currentTime+d+.01)}
function noise(ms=160,vol=.018){if(!audio)return;const len=Math.max(1,Math.floor(audio.sampleRate*ms/1000)),buf=audio.createBuffer(1,len,audio.sampleRate),data=buf.getChannelData(0);for(let i=0;i<len;i++)data[i]=(Math.random()*2-1)*(1-i/len);const src=audio.createBufferSource(),g=audio.createGain();src.buffer=buf;g.gain.value=vol;src.connect(g);g.connect(audio.destination);src.start()}
function show(html){scene.className='scene';scene.innerHTML=html;requestAnimationFrame(()=>scene.classList.add('on'))}
async function black(ms=5000){scene.classList.remove('on');await wait(1300);scene.className='scene black on';scene.innerHTML='';await wait(ms)}
function person(color){return `<div class="person"><div class="head"></div><div class="body" style="background:${color}"></div></div>`}
function chatShell(title='朋友們',sub='8 位成員'){return `<div class="phone-shell"><div class="phone"><div class="screen"><div class="notch"></div><div class="status"><span>18:42</span><span>5G　78%</span></div><div class="appbar"><div class="avatar">群</div><div><strong>${title}</strong><small>${sub}</small></div></div><div class="chat" id="chat"></div></div></div></div>`}
function bubble(text,type='other',delay=0,read=false){later(()=>{const c=document.querySelector('#chat');if(!c)return;const b=document.createElement('div');b.className=`bubble ${type}`;b.textContent=text;c.appendChild(b);tone(type==='me'?630:470,.055,.012);if(read){const r=document.createElement('div');r.className='read';r.textContent='已讀 7';c.appendChild(r)}},delay)}

async function ignored(){
 show(chatShell());
 bubble('今天晚上有人要一起吃飯嗎？','me',900,true);
 later(()=>{const c=document.querySelector('#chat');if(!c)return;const t=document.createElement('div');t.className='typing';t.innerHTML='<span class="dots"><span></span><span></span><span></span></span>';c.appendChild(t)},9000);
 bubble('晚上火鍋？','other',12500);bubble('+1','other',14500);bubble('我可以！','other',16000);bubble('哪一家？','other',17500);bubble('走啊哈哈哈','other',19500);
 await wait(39000)
}
async function missingPhoto(){
 show(`<div class="photo-scene"><div class="lights"></div><div class="people">${person('#e78b69')}${person('#5c8ce8')}${person('#7fb46c')}${person('#d3a34c')}${person('#a97bd7')}</div><div class="flash" id="flash"></div><div class="photo-card-wrap" id="photoWrap"><div class="photo-card"><div class="photo-inner"><div class="people">${person('#e78b69')}${person('#5c8ce8')}${person('#7fb46c')}${person('#d3a34c')}${person('#a97bd7')}</div><div class="story-strip">今天超開心 ❤️</div></div></div></div></div>`);
 later(()=>{document.querySelector('#flash')?.classList.add('go');noise(110,.028)},9000);
 later(()=>{const x=document.querySelector('#photoWrap');if(x)x.style.display='grid'},12000);
 await wait(34000)
}
async function cafeWait(){
 show(`<div class="cafe"><div class="window" id="window"></div><div class="clock" id="clock">13:00</div><div class="table"><div class="cup a"><div class="coffee"></div></div><div class="cup b"><div class="coffee"></div></div></div><div class="cafe-phone" id="cafeMsg"><small>朋友</small><div>抱歉，我今天臨時有事，改天好嗎？</div></div></div>`);
 const clock=document.querySelector('#clock');later(()=>{if(clock)clock.textContent='13:14'},9000);later(()=>{if(clock)clock.textContent='13:29'},18000);later(()=>{if(clock)clock.textContent='13:43';document.querySelector('#window')?.classList.add('evening')},27000);later(()=>{document.querySelector('#cafeMsg')?.classList.add('show');tone(470,.08,.02)},33000);
 await wait(50000)
}
async function workNotChosen(){
 show(`<div class="work-scene"><div class="desk"><div class="paper other-paper"><div class="band"></div></div><div class="paper mine"><div class="band"></div><div class="time-note">02:14</div></div><div class="paper winner"><div class="band"></div><div class="spot" id="spot"></div></div><div class="sticky one"></div><div class="sticky two"></div><div class="applause-text" id="applause">👏　👏　👏</div></div></div>`);
 later(()=>{document.querySelector('#spot')?.classList.add('show');document.querySelector('#applause')?.classList.add('show');noise(850,.012)},15000);
 await wait(42000)
}
async function giftNotGiven(){
 show(`<div class="gift-scene"><div class="party"><div class="party-people party-away" id="partyPeople">${person('#e88970')}${person('#5e90dc')}${person('#85b66b')}${person('#d0a14c')}</div></div><div class="bag"><div class="gift" id="gift"></div></div></div>`);
 later(()=>document.querySelector('#gift')?.classList.add('out'),8000);later(()=>document.querySelector('#partyPeople')?.classList.add('leave'),16500);later(()=>{const g=document.querySelector('#gift');g?.classList.remove('out');g?.classList.add('back')},24500);
 await wait(42000)
}
async function emptySeat(){
 show(`<div class="auditorium"><div class="stage-light"></div><div class="door" id="door"></div><div class="rows"><div class="row"><div class="seat"></div><div class="seat"></div><div class="seat reserved"></div><div class="seat"></div><div class="seat"></div></div><div class="row"><div class="seat"></div><div class="seat"></div><div class="seat"></div><div class="seat"></div><div class="seat"></div></div><div class="row"><div class="seat"></div><div class="seat"></div><div class="seat"></div><div class="seat"></div><div class="seat"></div></div></div></div>`);
 later(()=>document.querySelector('#door')?.classList.add('open'),9000);later(()=>document.querySelector('#door')?.classList.remove('open'),12500);later(()=>document.querySelector('#door')?.classList.add('open'),23000);later(()=>document.querySelector('#door')?.classList.remove('open'),26500);
 await wait(46000)
}
async function birthday(){
 show(`<div class="lock-scene"><div class="lock-phone"><div class="lock-screen"><div class="lock-time" id="lockTime">23:56</div><div class="lock-date" id="lockDate">8月29日 星期六</div><div class="notifications" id="notifs"></div></div></div></div>`);
 const n=document.querySelector('#notifs');later(()=>{if(!n)return;n.innerHTML='<div class="notif show"><small>電信服務</small><div>本月帳單已產生。</div></div>';tone(520,.06,.012)},7000);later(()=>{const t=document.querySelector('#lockTime');if(t)t.textContent='23:59'},16000);later(()=>{const t=document.querySelector('#lockTime'),d=document.querySelector('#lockDate');if(t)t.textContent='00:01';if(d)d.textContent='8月30日 星期日'},25000);
 await wait(38000)
}
async function leftover(){
 show(`<div class="snack"><div class="snack-table"><div class="plate a"><div class="bread"></div></div><div class="plate b"><div class="bread"></div></div><div class="hand" id="hand"></div></div></div>`);
 later(()=>document.querySelector('#hand')?.classList.add('show'),12000);
 await wait(38000)
}

const scenes=[ignored,missingPhoto,cafeWait,workNotChosen,giftNotGiven,emptySeat,birthday,leftover];
async function run(){
 clearTimers();const id=++runId;end.classList.remove('show');intro.style.display='none';ensureAudio();audio?.resume?.();document.documentElement.requestFullscreen?.().catch?.(()=>{});
 await black(2500);
 for(let i=0;i<scenes.length;i++){
   if(id!==runId)return;
   await scenes[i]();
   if(id!==runId)return;
   if(i<scenes.length-1)await black(5000);
 }
 if(id!==runId)return;
 await black(8000);end.classList.add('show')
}
function reset(){runId++;clearTimers();scene.className='scene black';scene.innerHTML='';end.classList.remove('show');intro.style.display='grid'}
