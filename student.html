<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate, max-age=0">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <title>體驗回填｜情緒包廂</title>
  <link rel="stylesheet" href="css/style.css?v=20260829-1">
</head>
<body>
  <main class="shell" style="max-width:820px">
    <div class="topbar"><div class="brand"><span class="brand-mark">情</span><span id="roomExperienceTitle">情緒體驗</span></div><span class="small-note">完成體驗後再填寫</span></div>

    <section class="panel" id="invalidRoom" hidden>
      <div class="eyebrow">QR CODE REQUIRED</div>
      <h1 style="font-size:clamp(2rem,7vw,3.2rem)">請掃描現場的包廂 QR Code</h1>
      <p class="lead">每一間包廂都有自己的 QR Code。完成體驗後，請重新掃描該包廂的 QR Code 進入填寫頁面。</p>
    </section>

    <section class="panel" id="inputStep" hidden>
      <div class="eyebrow">體驗完成後</div>
      <div class="room-head" id="roomHead"></div>
      <form id="emotionForm">
        <label class="form-label">剛才最明顯的感覺是什麼？ <span class="small-note">最多 3 個詞</span></label>
        <div class="word-row">
          <input class="input emotion-input" maxlength="12" placeholder="第一個感覺">
          <input class="input emotion-input" maxlength="12" placeholder="第二個感覺（選填）">
          <input class="input emotion-input" maxlength="12" placeholder="第三個感覺（選填）">
        </div>
        <p class="small-note" style="margin-top:10px">不用猜這間包廂想讓你感受到什麼，只寫你自己真的出現的感覺。</p>

        <div style="margin-top:14px">
          <button class="btn soft" id="moreEmotionsBtn" type="button" aria-expanded="false" aria-controls="emotionSuggestions">更多情緒</button>
        </div>

        <div id="emotionSuggestions" hidden style="margin-top:14px;padding:16px;border:1px solid var(--line);border-radius:18px;background:rgba(255,255,255,.72)">
          <div style="font-weight:900;margin-bottom:4px">想不到怎麼形容？可以參考這些詞</div>
          <div class="small-note">沒有標準答案，只挑真正接近你感受的就好。</div>
          <div class="chips" id="emotionChips"></div>
          <div class="small-note" id="emotionSuggestionStatus" aria-live="polite" style="margin-top:10px"></div>
        </div>

        <label class="form-label" for="comment">如果想多留一句話，可以寫下來 <span class="small-note">選填</span></label>
        <textarea id="comment" maxlength="180" placeholder="例如：我注意到自己一開始很想逃開，後來又有一點好奇。"></textarea>
        <div class="btn-row"><button class="btn primary" type="submit">送出我的感受</button></div>
      </form>
      <div class="success" id="successBox">
        <div class="big">✓</div><h2>收到你的感受了</h2>
        <p>下一間體驗完成後，請再掃描那一間的 QR Code。</p>
      </div>
    </section>
  </main>
  <script>
    window.addEventListener('pageshow', (event) => {
      if (event.persisted) window.location.reload();
    });
  </script>
  <script type="module" src="js/student.js?v=20260829-1"></script>
</body>
</html>
