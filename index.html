<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate, max-age=0">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <title>情緒體驗</title>
  <link rel="stylesheet" href="css/style.css?v=20260829-1">
</head>
<body>
  <main class="shell" style="max-width:820px">
    <div class="topbar"><div class="brand"><span class="brand-mark">情</span> 情緒體驗</div><span class="small-note">Emotion Rooms</span></div>
    <section class="hero">
      <div class="eyebrow">體驗完成後再回填</div>
      <h1>請掃描現場的<br>包廂 QR Code</h1>
      <p class="lead">每一間體驗都有不同的 QR Code。完成當下的體驗後，再掃描該包廂的 QR Code，留下你自己真正出現的感受。</p>
      <div class="panel" style="margin-top:28px">
        <p style="margin:0">不需要先知道這間包廂代表什麼，也沒有標準答案。</p>
      </div>
    </section>
  </main>
  <script>
    window.addEventListener('pageshow', (event) => {
      if (event.persisted) window.location.reload();
    });
  </script>
</body>
</html>
